  scan.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); scanEnter(); } });
  $('#dType').value = S.discType; $('#dVal').value = S.discValue ? moneyTxt(S.discValue) : '';
  $('#dType').addEventListener('change', e => { S.discType = e.target.value; if (S.discType === 'percent' && S.discValue > 100) { S.discValue = 100; $('#dVal').value = '100'; } renderCart(); });
  $('#dVal').addEventListener('input', e => {
    let v = moneyVal(e.target.value); if (S.discType === 'percent' && v > 100) { v = 100; }
    S.discValue = v; e.target.value = v ? moneyTxt(v) : ''; renderTotals();
  });
  $('#cartList').addEventListener('change', e => {
    const i = e.target.closest('.qin'); if (!i) { return; }
    setQty(Number(i.dataset.i), moneyVal(i.value) || 1, true);
  });
  renderCatalog(); renderCart();
  if (window.matchMedia('(min-width:901px)').matches) { scan.focus(); }
}

function renderCatalog() {
  const bar = $('#catBar'), grid = $('#grid'); if (!bar || !grid) { return; }
  const cats = ['all'].concat(S.categories.filter(c => S.products.some(p => p.category === c)));
  if (S.products.some(p => !p.category)) { cats.push('__none'); }
  if (!cats.includes(S.cat)) { S.cat = 'all'; }
  bar.innerHTML = cats.map(c => '<button type="button" class="chip" aria-pressed="' + (S.cat === c) + '" data-act="cat" data-cat="' + esc(c) + '">' + (c === 'all' ? '' : '<span class="dot" style="--h:' + hueOf(c === '__none' ? '' : c) + '"></span>') + (c === 'all' ? 'Semua' : c === '__none' ? 'Lainnya' : esc(c)) + '</button>').join('');
  const q = S.q.trim().toLowerCase();
  const list = S.products.filter(p => (S.cat === 'all' || (S.cat === '__none' ? !p.category : p.category === S.cat)) &&
    (!q || (p.name + ' ' + p.sku + ' ' + p.barcode).toLowerCase().includes(q)));
  grid.innerHTML = list.length ? list.map(p => {
    const out = p.track_stock && p.stock <= 0, low = p.track_stock && !out && p.stock <= p.min_stock;
    const st = p.type === 'jasa' ? '<span class="st">Jasa</span>' : !p.track_stock ? '<span class="st">' + esc(p.unit) + '</span>' : out ? '<span class="st out">Stok habis</span>' : '<span class="st' + (low ? ' low' : '') + '">' + (low ? 'Menipis · ' : 'Stok ') + int(p.stock) + ' ' + esc(p.unit) + '</span>';
    return '<button type="button" class="pcard" style="--h:' + hueOf(p.category || p.name) + '" data-act="add" data-id="' + p.id + '"' + (out ? ' disabled' : '') + '>' + thumb(p.name, p.category || p.name) + '<span class="nm">' + esc(p.name) + '</span>' + st + '<span class="pr">' + rp(p.price) + '</span></button>';
  }).join('') : '<div class="empty" style="grid-column:1/-1"><strong>Produk tidak ditemukan</strong>' + (S.products.length ? 'Coba kata kunci lain.' : (S.user.role === 'admin' ? 'Tambahkan produk lewat menu Produk.' : 'Belum ada produk. Hubungi Kasir Admin.')) + '</div>';
}

function scanEnter() {
  const q = S.q.trim(); if (!q) { return; }
  const ql = q.toLowerCase();
  let p = S.products.find(x => x.barcode && x.barcode === q) || S.products.find(x => x.sku && x.sku.toLowerCase() === ql);
  if (!p) {
    const m = S.products.filter(x => (x.name + ' ' + x.sku + ' ' + x.barcode).toLowerCase().includes(ql));
    if (m.length === 1) { p = m[0]; }
    else { toast(m.length ? 'Ada ' + m.length + ' produk cocok — pilih dari daftar.' : 'Produk "' + q + '" tidak ditemukan.', m.length ? '' : 'err'); return; }
  }
  addToCart(p); S.q = ''; $('#scan').value = ''; renderCatalog();
}

function addToCart(p) {
  if (p.track_stock && p.stock <= 0) { toast('Stok "' + p.name + '" habis.', 'err'); return; }
  const l = S.cart.find(x => x.product_id === p.id);
  if (l) { setQty(S.cart.indexOf(l), l.qty + 1, false); return; }
  S.cart.push({ product_id: p.id, name: p.name, price: p.price, qty: 1, unit: p.unit, tracked: p.track_stock, max: p.track_stock ? p.stock : 999999 });
  renderCart();
}
function setQty(i, q, fromInput) {
  const l = S.cart[i]; if (!l) { return; }
  if (q < 1) { S.cart.splice(i, 1); renderCart(); return; }
  if (q > l.max) { q = l.max; toast('Stok "' + l.name + '" hanya ' + int(l.max) + ' ' + l.unit + '.', 'err'); }
  l.qty = q; renderCart();
  if (fromInput) { const inp = $('.qin[data-i="' + i + '"]'); if (inp) { inp.focus(); inp.select(); } }
}

function renderCart() {
  const list = $('#cartList'); if (!list) { return; }
  const count = S.cart.reduce((a, l) => a + l.qty, 0);
  $('#cartCount').textContent = int(count);
  $('#paneCart').textContent = 'Keranjang' + (S.cart.length ? ' · ' + rp(calcCart().grand) : '');
  $('#clearBtn').hidden = !S.cart.length;
  const cu = custOf();
  const cb = $('#custBtn'); cb.className = 'cust-btn' + (cu ? ' on' : '');
  cb.innerHTML = '<span aria-hidden="true">👤</span><span>' + (cu ? esc(cu.name) : 'Pelanggan umum') + '</span>';
  list.innerHTML = S.cart.length ? S.cart.map((l, i) =>
    '<div class="cart-line">' + (() => { const p = S.products.find(x => x.id === l.product_id); return thumb(l.name, p ? (p.category || p.name) : l.name); })() + '<div><div class="nm">' + esc(l.name) + '</div><div class="pr">' + rp(l.price) + ' / ' + esc(l.unit) + '</div></div><div class="sub">' + rp(l.price * l.qty) + '</div>' +
    '<div class="ctl"><div class="qty"><button type="button" data-act="dec" data-i="' + i + '" aria-label="Kurangi">−</button>' +
    '<input class="qin" data-i="' + i + '" type="text" inputmode="numeric" value="' + l.qty + '" aria-label="Jumlah ' + esc(l.name) + '">' +
    '<button type="button" data-act="inc" data-i="' + i + '" aria-label="Tambah">+</button></div>' +
    '<button type="button" class="rm" data-act="rm" data-i="' + i + '" aria-label="Hapus ' + esc(l.name) + '">Hapus</button></div></div>').join('')
    : '<div class="empty"><strong>Keranjang kosong</strong>Scan barcode atau pilih produk di sebelah.</div>';

}
function renderTotals() {
  const c = calcCart();
  $('#sSub').textContent = rp(c.sub);
  $('#rowDisc').hidden = !c.disc; $('#sDisc').textContent = '-' + rp(c.disc);
  $('#rowTax').hidden = !(ST().tax_rate > 0); $('#taxLbl').textContent = 'Pajak (' + (ST().tax_rate || 0) + '%)'; $('#sTax').textContent = rp(c.tax);
  $('#sTotal').textContent = rp(c.grand);

  const c = calcCart(); let method = 'cash';
  const m = openModal({
    title: 'Pembayaran', focus: '#paid',

      '<div class="method-grid" role="group" aria-label="Metode pembayaran">' + Object.keys(PAY).map(k => '<button type="button" class="method" data-m="' + k + '" aria-pressed="' + (k === 'cash') + '">' + PAY[k] + '</button>').join('') + '</div>' +
      '<div id="cashBox"><label class="field" style="margin-bottom:0"><span>Uang diterima</span><input id="paid" class="money-input" type="text" inputmode="numeric" autocomplete="off"></label>' +

    const v = moneyVal(paid.value), d = v - c.grand, box = m.$('#chg');

    box.innerHTML = '<span>' + (v && d < 0 ? 'Kurang' : 'Kembalian') + '</span><strong>' + rp(v ? Math.abs(d) : 0) + '</strong>';
  };
  const q = [c.grand, Math.ceil(c.grand / 10000) * 10000, Math.ceil(c.grand / 50000) * 50000, Math.ceil(c.grand / 100000) * 100000];
  m.$('#quick').innerHTML = q.filter((v, i) => q.indexOf(v) === i).slice(0, 4).map((v, i) => '<button type="button" data-v="' + v + '">' + (v === c.grand ? 'Uang pas' : rp(v)) + '</button>').join('');
  m.$('#quick').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { paid.value = moneyTxt(b.dataset.v); cashCalc(); paid.focus(); } });
  paid.addEventListener('input', () => { paid.value = moneyTxt(paid.value); cashCalc(); });
  const invHint = () => {
    const cu = custOf(), el = m.$('#invNote');
    if (cu && (method === 'cash' || method === 'transfer')) { el.className = 'note-inv'; el.textContent = 'Pelanggan terdaftar (' + cu.name + '): invoice A4 dapat dicetak / disimpan sebagai PDF setelah pembayaran.'; }
    else if (method === 'qris' && !ST().qris_ready) { el.className = 'muted'; el.style.cssText = 'margin-top:10px;font-size:13px'; el.textContent = 'Gambar QRIS belum diunggah' + (S.user.role === 'admin' ? ' (Pengaturan → Pembayaran QRIS).' : '. Hubungi Kasir Admin.'); }
    else if (!cu && (method === 'cash' || method === 'transfer')) { el.className = 'muted'; el.style.cssText = 'margin-top:10px;font-size:13px'; el.textContent = 'Butuh invoice? Tutup, lalu pilih pelanggan terdaftar di keranjang.'; }
    else { el.className = ''; el.textContent = ''; }
  };
  const goText = () => (method === 'qris' && ST().qris_ready) ? 'Pembayaran sudah diterima' : 'Proses pembayaran';
  const showQris = async () => {
    const box = m.$('#qrisBox'), on = method === 'qris' && ST().qris_ready;
    box.hidden = !on; m.$('#payGo').textContent = goText(); if (!on) { return; }
    box.innerHTML = '<div class="muted" style="text-align:center;padding:24px">Memuat QRIS…</div>';
    try {
      const img = await getQris(); if (method !== 'qris') { return; }
      box.innerHTML = '<div class="qris-view"><img src="' + esc(img) + '" alt="QRIS untuk pembayaran"><p><b>Minta pelanggan scan QRIS ini</b> lalu bayar <b>' + rp(c.grand) + '</b>.</p><p class="muted">QRIS statis: nominal diketik sendiri oleh pelanggan. Tekan tombol hijau setelah dana benar-benar masuk.</p></div>';
    } catch (e) { box.innerHTML = '<div class="form-error">' + esc(e.message) + '</div>'; }
  };
  m.$$('.method').forEach(b => b.addEventListener('click', () => {
    method = b.dataset.m; m.$$('.method').forEach(x => x.setAttribute('aria-pressed', x === b));
    m.$('#cashBox').hidden = method !== 'cash'; invHint(); showQris(); if (method === 'cash') { paid.focus(); }
  }));
  cashCalc(); invHint();
  m.$('[data-close2]').onclick = () => m.close();
  const go = async () => {
    const btn = m.$('#payGo'), err = m.$('#payErr'); err.hidden = true;
    const amount = method === 'cash' ? moneyVal(paid.value) : c.grand;
    if (method === 'cash' && amount < c.grand) { err.textContent = 'Uang yang diterima kurang dari total belanja.'; err.hidden = false; paid.focus(); return; }
    if (btn.disabled) { return; } btn.disabled = true; btn.textContent = 'Memproses…';
    const body = {
      ref: m.ref || (m.ref = newRef('tx')),
      items: S.cart.map(l => ({ product_id: l.product_id, qty: l.qty })), customer_id: S.customerId || 0,

    };
    try {
      let tx;
      try { tx = await api('checkout', body); }
      catch (e) { if (e.code !== 'OFFLINE') { throw e; } tx = offlineCheckout(body, c); }

      tx.items.forEach(i => { const p = S.products.find(x => x.id === i.product_id); if (p && p.track_stock) { p.stock = p.stock - i.qty; } });
      S.cart = []; S.customerId = 0; S.discValue = 0; S.discType = 'percent'; $('#dVal').value = ''; $('#dType').value = 'percent';
      S.pane = 'catalog'; const kz = $('#kasir'); if (kz) { kz.dataset.pane = 'catalog'; }
      m.close(); renderCatalog(); renderCart(); showDone(tx);
    } catch (e) {
      if (e.code === 'AUTH') { return; }
      err.textContent = e.message; err.hidden = false; btn.disabled = false; btn.textContent = goText();
      if (/Stok|produk/i.test(e.message)) { refreshCatalog(true); }
    }
  };
  m.$('#payGo').onclick = go;
  m.el.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.tagName === 'INPUT' && e.target.id !== 'note') { e.preventDefault(); go(); } });
}

function showDone(tx) {

      (tx.pending ? '<p class="note-off">Tersimpan di perangkat (offline). Nomor <b>' + esc(tx.invoice_no) + '</b> bersifat sementara; nomor invoice resmi diberikan saat terkirim ke server. Invoice A4 bisa dicetak dari Riwayat setelah tersinkron.</p>' : '') +

      '<div class="actions" style="margin-bottom:10px"><span class="muted">Struk:</span><div class="seg" role="group" aria-label="Lebar kertas struk"><button type="button" data-w="80" aria-pressed="' + (S.paper === 80) + '">80 mm</button><button type="button" data-w="58" aria-pressed="' + (S.paper === 58) + '">58 mm</button></div></div>' +
      '<div class="receipt-wrap" id="rw"></div>',
    foot: '<button type="button" class="btn" data-act="prnSetup" title="Atur printer struk">🖨 Printer</button><button type="button" class="btn" id="prRc">Cetak struk</button>' + (inv ? '<button type="button" class="btn btn-primary" id="prInv">Invoice / PDF</button>' : '') + '<button type="button" class="btn btn-pay" id="newTx">Transaksi baru</button>',
    onClose() { const s = $('#scan'); if (s && window.matchMedia('(min-width:901px)').matches) { s.focus(); } }
  });
  const draw = () => { m.$('#rw').innerHTML = '<div class="paper" style="width:fit-content">' + receiptHtml(tx, S.paper) + '</div>'; };
  draw();
  m.$$('[data-w]').forEach(b => b.addEventListener('click', () => { S.paper = Number(b.dataset.w); store.set('ksr_paper', S.paper); m.$$('[data-w]').forEach(x => x.setAttribute('aria-pressed', x === b)); draw(); }));
  m.$('#prRc').onclick = () => printReceipt(tx);
  if (inv) { m.$('#prInv').onclick = e => run(e.currentTarget, () => showInvoice(tx.id)); }
  m.$('#newTx').onclick = () => m.close();

}

/* ----- muat ulang katalog (stok) ----- */
async function refreshCatalog(force) {
  if (S.view !== 'kasir' || (!force && modals.length)) { return; }
  try {
    const b = await api('bootstrap'); saveCache(b);
    S.settings = b.settings; if (!S.themeDraft) { applyColors(S.settings.theme, true); } S.products = applyQueueStock(b.products); S.categories = b.categories; S.customers = b.customers;
    S.cart.forEach(l => { const p = S.products.find(x => x.id === l.product_id); if (p) { l.max = p.track_stock ? p.stock : 999999; l.price = p.price; l.tracked = p.track_stock; } });
    S.cart = S.cart.filter(l => S.products.some(p => p.id === l.product_id));
    if (!S.customers.some(c => c.id === S.customerId)) { S.customerId = 0; }
    if ($('#grid')) { renderCatalog(); renderCart(); }
  } catch (e) { /* diam: mungkin koneksi sesaat putus */ }
}
setInterval(() => { if (S.token && !document.hidden) { refreshCatalog(false); } }, 60000);

Object.assign(ACT, {
  add(t) { const p = S.products.find(x => x.id === Number(t.dataset.id)); if (p) { addToCart(p); } },

const PRESETS = [['today', 'Hari ini'], ['7', '7 hari'], ['30', '30 hari'], ['month', 'Bulan ini'], ['lastmonth', 'Bulan lalu'], ['custom', 'Kustom']];
function presetRange(p) {
  const t = ymdNow();
  if (p === 'today') { return [t, t]; }
  if (p === '7') { return [addD(t, -6), t]; }
  if (p === '30') { return [addD(t, -29), t]; }
  if (p === 'month') { return [t.slice(0, 8) + '01', t]; }
  if (p === 'lastmonth') { const end = addD(t.slice(0, 8) + '01', -1); return [end.slice(0, 8) + '01', end]; }
  return null;
}
S.dash = { preset: '7', from: presetRange('7')[0], to: presetRange('7')[1], type: 'all', q: '', data: null };

function rangeBar(scope) {
  const R = S[scope];
  return '<div class="range"><div class="chips" role="group" aria-label="Periode">' + PRESETS.map(p => '<button type="button" class="chip" aria-pressed="' + (R.preset === p[0]) + '" data-act="preset" data-scope="' + scope + '" data-p="' + p[0] + '">' + p[1] + '</button>').join('') + '</div>' +
    '<div class="actions"><label class="muted" for="' + scope + 'F">Dari</label><input type="date" id="' + scope + 'F" value="' + R.from + '" max="' + ymdNow() + '" data-chg="rangeDate" data-scope="' + scope + '">' +
    '<label class="muted" for="' + scope + 'T">sampai</label><input type="date" id="' + scope + 'T" value="' + R.to + '" max="' + ymdNow() + '" data-chg="rangeDate" data-scope="' + scope + '"></div></div>';
}
const periodTxt = r => r.from === r.to ? dmy(r.from) : dmy(r.from) + ' – ' + dmy(r.to);
const shortRp = v => v >= 1e9 ? (v / 1e9).toFixed(1).replace('.', ',') + ' M' : v >= 1e6 ? (v / 1e6).toFixed(v % 1e6 ? 1 : 0).replace('.', ',') + ' jt' : v >= 1e3 ? Math.round(v / 1e3) + ' rb' : String(Math.round(v));
function niceMax(v) { if (v <= 0) { return 100000; } const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function barChart(data, h) {
  h = h || 210; const vw = $('#view') ? $('#view').clientWidth : 720, W = Math.max(280, Math.min(760, vw - 60)), L = 50, B = 26, T = 10, R = 6, pw = W - L - R, ph = h - B - T;
  const max = niceMax(Math.max.apply(null, data.map(d => d.sales).concat([0])));
  let g = '';
  for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; g += '<line class="grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + shortRp(max * i / 4) + '</text>'; }
  const n = data.length, slot = pw / n, bw = Math.min(46, Math.max(2, slot * .68)), step = Math.ceil(n / Math.max(3, Math.floor(pw / 58)));
  data.forEach((d, i) => {
    const bh = d.sales / max * ph, x = L + slot * i + (slot - bw) / 2;
    g += '<rect class="bar' + (i === n - 1 ? ' last' : '') + '" x="' + x.toFixed(1) + '" y="' + (T + ph - bh).toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + Math.max(bh, d.sales ? 1 : 0).toFixed(1) + '" rx="2"><title>' + dmy(d.date) + ': ' + rp(d.sales) + (d.tx !== undefined ? ' · ' + d.tx + ' transaksi' : '') + '</title></rect>';
    if (i % step === 0) { g += '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (h - 8) + '" text-anchor="middle">' + dshort(d.date) + '</text>'; }
  });
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="Grafik penjualan per hari">' + g + '</svg>';
}

function bindTheme() {
  const card = $('#thCard'); if (!card) { return; }
  const cur = () => S.themeDraft || themeOf(ST().theme);
  const sync = () => {
    const t = cur();
    Object.keys(t).forEach(k => { const c = $('#thc_' + k), x = $('#tht_' + k); if (c) { c.value = t[k]; } if (x && document.activeElement !== x) { x.value = t[k]; } });
    $$('.th-preset', card).forEach(b => { const p = THEME_PRESETS[Number(b.dataset.i)][1]; b.setAttribute('aria-pressed', String(Object.keys(p).every(k => p[k] === t[k]))); });
  };
  const preview = t => { S.themeDraft = themeOf(t); applyColors(S.themeDraft); sync(); };
  if (card.dataset.bound) { sync(); return; }
  card.dataset.bound = '1';
  $('#thPresets').addEventListener('click', e => { const b = e.target.closest('.th-preset'); if (b) { preview(THEME_PRESETS[Number(b.dataset.i)][1]); } });
  $$('input[type=color]', card).forEach(i => i.addEventListener('input', () => preview(Object.assign({}, cur(), { [i.dataset.k]: i.value }))));
  $$('.th-color input[type=text]', card).forEach(i => i.addEventListener('input', () => {
    let v = i.value.trim(); if (v && v[0] !== '#') { v = '#' + v; }
    if (HEX.test(v)) { preview(Object.assign({}, cur(), { [i.dataset.k]: v.toLowerCase() })); }
  }));
  sync();
}

  if (!ST().qris_ready) {

  }
  b.innerHTML = '<span class="muted">Memuat…</span>';

    const img = await getQris(); if (!$('#qrisBox')) { return; }
    b.innerHTML = '<img src="' + esc(img) + '" alt="QRIS saat ini" style="max-height:130px;max-width:130px"><div class="actions"><label class="btn btn-sm" style="cursor:pointer">Ganti QRIS<input type="file" id="qrisFile" accept="image/png,image/jpeg,image/webp" class="sr" data-chg="qrisPick"></label><button type="button" class="btn btn-sm btn-danger" data-act="qrisDel">Hapus</button></div>';
  } catch (e) { b.innerHTML = '<span class="muted">' + esc(e.message) + '</span>'; }
}
/** Perkecil gambar QRIS (tanpa dipangkas agar tetap terbaca) hingga cukup kecil untuk disimpan di Sheet. */
function shrinkQris(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let scale = Math.min(1, 1000 / Math.max(img.width, img.height)), out = '';
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * scale)); c.height = Math.max(1, Math.round(img.height * scale));
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
        out = c.toDataURL('image/jpeg', .9); if (out.length <= 300000) { return resolve(out); } scale *= .85;
      }
      reject(new Error('Gambar QRIS terlalu besar. Gunakan gambar yang lebih kecil.'));
    };
    img.onerror = () => reject(new Error('File gambar tidak dapat dibaca.'));
    img.src = url;
  });
}

    '<small class="muted" style="flex-basis:100%">PNG/JPG, otomatis diperkecil. Logo tersimpan langsung saat dipilih.</small>';
}
function invPreview() {

  e.textContent = ST().inv_yy + '-' + code + '-' + String(n).padStart(6, '0');
}
function shrinkImage(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      let base = img; try { base = trimCanvas(img) || img; } catch (e) { base = img; }   // buang ruang kosong di sekeliling logo
      const bw = base.naturalWidth || base.width, bh = base.naturalHeight || base.height;
      let scale = Math.min(1, 800 / bw, 320 / bh), out = '';
      const png = file.type !== 'image/jpeg' || !!base._alpha;
      for (let i = 0; i < 6; i++) {
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(bw * scale)); c.height = Math.max(1, Math.round(bh * scale));
        const g = c.getContext('2d'); if (!png) { g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); }
        g.drawImage(base, 0, 0, c.width, c.height); out = c.toDataURL(png ? 'image/png' : 'image/jpeg', .9);
        if (out.length <= 200000) { return resolve(out); } scale *= .8;
      }
      reject(new Error('Gambar terlalu kompleks. Gunakan logo yang lebih sederhana.'));
    };
    img.onerror = () => reject(new Error('File gambar tidak dapat dibaca.'));
    img.src = url;
  });
}

/* ---------- backup & pulihkan (aplikasi Android tanpa server) ---------- */
function backupCardHtml() {
  const last = Number(store.get('ksr_lastbackup') || 0), st = window.KASIRKU_LOCAL.stats();
  return '<div class="card" id="bkCard"><div class="card-head"><h2>Backup & pulihkan data</h2><span class="badge ' + (last ? 'ok' : 'warn') + '">' + (last ? 'Terakhir ' + new Date(last).toLocaleString('id-ID', { dateStyle: 'medium', timeStyle: 'short' }) : 'Belum pernah backup') + '</span></div><div class="card-body">' +
    '<p class="muted" style="margin:0 0 12px">Semua data (' + int(st.transactions) + ' transaksi, ' + int(st.products) + ' produk, ' + int(st.customers) + ' pelanggan) hanya tersimpan di HP ini. Simpan file backup ke Google Drive, WhatsApp, atau komputer secara rutin — jika aplikasi dihapus atau HP rusak, data bisa dipulihkan dari file tersebut.</p>' +
    '<div class="actions"><button type="button" class="btn btn-primary" data-act="backupNow">Backup data</button>' +
    '<label class="btn" style="cursor:pointer">Pulihkan dari file<input type="file" id="bkFile" accept="application/json,.json" data-chg="restorePick" hidden></label></div>' +
    '<p class="muted" style="margin:10px 0 0;font-size:13px">Pulihkan akan <b>mengganti</b> seluruh data di HP ini dengan isi file backup.</p></div></div>';
}
function backupName() { const d = new Date(Date.now() + 7 * 3600e3).toISOString(); return 'pinapos-backup-' + d.slice(0, 10) + '-' + d.slice(11, 16).replace(':', '') + '.json'; }
window.ksrSaved = (ok, msg) => {
  if (ok) { store.set('ksr_lastbackup', String(Date.now())); store.del('ksr_bkdirty'); toast('Backup tersimpan: ' + msg, 'ok'); renderBanner(); if (S.view === 'pengaturan') { viewPengaturan(); } }
  else if (msg) { toast(msg, msg === 'Dibatalkan' ? '' : 'err'); }
};
window.ksrStorageError = e => toast('Data gagal disimpan ke HP: ' + (e && e.message || e) + '. Periksa sisa memori HP.', 'err');
window.ksrFlush = () => { if (IS_LOCAL) { window.KASIRKU_LOCAL.flush(); } };
Object.assign(ACT, {
  backupNow(t) {
    run(t, async () => {
      await window.KASIRKU_LOCAL.flush();
      const data = JSON.stringify(window.KASIRKU_LOCAL.exportData()), name = backupName();
      if (ANDROID && ANDROID.saveFile) { ANDROID.saveFile(name, 'application/json', data); return; }   // hasil lewat window.ksrSaved
      const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = name;
      document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
      window.ksrSaved(true, name);
    });
  }
});
Object.assign(CHG, {
  restorePick(t) {
    const f = t.files[0]; t.value = ''; if (!f) { return; }
    const rd = new FileReader();
    rd.onload = async () => {
      let b; try { b = JSON.parse(rd.result); } catch (e) { toast('File tidak dapat dibaca. Pilih file backup PinaPos (.json).', 'err'); return; }
      if (!b || b.app !== 'kasirku') { toast('File ini bukan backup PinaPos.', 'err'); return; }
      const n = b.tables && b.tables.Transactions ? b.tables.Transactions.length : 0;
      const ok = await confirmBox({ title: 'Pulihkan data?', message: 'Seluruh data di HP ini akan <b>diganti</b> dengan isi backup' + (b.exported_at ? ' tanggal ' + esc(new Date(b.exported_at).toLocaleString('id-ID')) : '') + ' (' + int(n) + ' transaksi). Tindakan ini tidak dapat dibatalkan.', ok: 'Pulihkan', danger: true });
      if (!ok) { return; }
      try {
        await window.KASIRKU_LOCAL.restoreData(b);
        store.del('ksr_tok'); store.del('ksr_bkdirty'); store.set('ksr_lastbackup', String(Date.now()));
        showLogin('Data berhasil dipulihkan. Silakan masuk dengan akun dari backup tersebut.');
      } catch (e) { toast(e.message, 'err'); }
    };
    rd.readAsText(f);
  }
});

/* ---------- tombol kembali HP Android ---------- */
window.ksrBack = () => {
  const menu = $('#menu'); if (menu && !menu.hidden) { menu.hidden = true; return true; }
  if (modals.length) { const m = modals[modals.length - 1]; const x = m.$('#newTx'); if (x) { x.click(); } else { m.close(); } return true; }
  if (S.navOverlay) { S.navOverlay = false; applyNav(); return true; }
  if (!S.user) { return false; }
  if (S.view === 'kasir' && S.pane === 'cart') { S.pane = 'catalog'; const k = $('#kasir'); if (k) { k.dataset.pane = 'catalog'; } return true; }
  if (S.view !== 'kasir') { go('kasir'); return true; }
  return false;
};

});
