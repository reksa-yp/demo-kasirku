<style>
/* ===== PinaPos - tampilan ===== */
:root {
  /* ====== PALET PINAPOS — ubah di sini untuk mengganti warna seluruh aplikasi ====== */
  --bg:#f6f4ec; --surface:#fff; --surface-2:#efece2; --ink:#1b2a22; --muted:#5a665e; --line:#e1ddd0;
  --brand:#1f6f43; --brand-2:#2e8b57; --brand-ink:#fff; --brand-soft:#dcefe3;
  --accent:#f2b705; --accent-2:#ffd04d; --accent-soft:#fdf3d2;
  --bar:#173a2a; --bar-2:#1f4d37; --bar-ink:#eef6f0; --bar-line:rgba(255,255,255,.12);
  --lcd:#173a2a; --lcd-ink:#f2c94c;
  --pay:#f2b705; --pay-2:#ffd04d; --pay-hover:#d9a300; --pay-ink:#1b2a22;
  --ok:#0b7a4b; --ok-bg:#d9f4e6; --warn:#9a4a00; --warn-bg:#ffedd2; --danger:#c3302a; --danger-bg:#fde6e4;
  --shadow:0 18px 44px -12px rgba(15,42,36,.35); --shadow-sm:0 1px 2px rgba(15,42,36,.06),0 4px 14px -6px rgba(15,42,36,.12);
  --r:14px; --r-sm:10px;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"SF Pro Display",Roboto,Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ color-scheme:dark; --bg:#0d130f; --surface:#151d18; --surface-2:#1b2620; --ink:#e9f1ec; --muted:#9aaba1; --line:#27352d;
    --brand:#5cc28a; --brand-2:#7fd3a4; --brand-ink:#08140d; --brand-soft:#173525; --accent:#f5c437; --accent-2:#ffd866; --accent-soft:#3a2f0c;
    --bar:#0a1510; --bar-2:#13291d; --lcd:#0a1510; --pay:#f2b705; --pay-hover:#ffc93c;
    --pay-2:#ffd04d; --ok:#6ee7b0; --ok-bg:#0f2e21; --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#ff8f86; --danger-bg:#3a1614;
    --shadow:0 18px 44px -12px rgba(0,0,0,.7); --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 4px 14px -6px rgba(0,0,0,.5); }
}
:root[data-theme="dark"]{ color-scheme:dark; --bg:#0d130f; --surface:#151d18; --surface-2:#1b2620; --ink:#e9f1ec; --muted:#9aaba1; --line:#27352d;
  --brand:#5cc28a; --brand-2:#7fd3a4; --brand-ink:#08140d; --brand-soft:#173525; --accent:#f5c437; --accent-2:#ffd866; --accent-soft:#3a2f0c;
  --bar:#0a1510; --bar-2:#13291d; --lcd:#0a1510; --pay:#f2b705; --pay-hover:#ffc93c;
  --pay-2:#ffd04d; --ok:#6ee7b0; --ok-bg:#0f2e21; --warn:#fbbf24; --warn-bg:#3a2a08; --danger:#ff8f86; --danger-bg:#3a1614;
  --shadow:0 18px 44px -12px rgba(0,0,0,.7); --shadow-sm:0 1px 2px rgba(0,0,0,.4),0 4px 14px -6px rgba(0,0,0,.5); }

*,*::before,*::after{ box-sizing:border-box; }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
body{ min-height:100%; margin:0; display:flex; flex-direction:column; font:15px/1.45 var(--font); color:var(--ink); background:var(--bg); font-variant-numeric:tabular-nums; -webkit-tap-highlight-color:transparent; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
[hidden]{ display:none !important; }
:focus-visible{ outline:3px solid color-mix(in srgb,var(--brand) 55%,transparent); outline-offset:1px; }
h1,h2,h3{ margin:0; line-height:1.2; }
kbd{ display:inline-block; padding:0 6px; margin-left:6px; font:600 12px/20px var(--font); border:1px solid currentColor; border-radius:5px; opacity:.65; }
.muted{ color:var(--muted); } .num{ text-align:right; } .nowrap{ white-space:nowrap; } .grow{ flex:1; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* progress bar */
#bar{ position:fixed; z-index:200; top:0; left:0; height:3px; width:0; background:var(--lcd-ink); box-shadow:0 0 8px var(--lcd-ink); transition:width .25s ease,opacity .3s; opacity:0; pointer-events:none; }
#bar.on{ opacity:1; width:70%; transition:width 6s cubic-bezier(.1,.6,.2,1); }
#bar.done{ width:100%; opacity:0; transition:width .15s,opacity .3s .15s; }

/* demo banner */
.demo-note{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; padding:6px 12px; font-size:13px; color:#3d2a00; background:#ffe9a8; }
.demo-note button{ padding:2px 10px; color:inherit; background:transparent; border:1px solid currentColor; border-radius:6px; }

/* ---------- login ---------- */
.login{ flex:1; display:grid; place-items:center; padding:24px 16px; }
.login-card{ width:min(420px,100%); padding:28px 26px 24px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
.login-brand{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:14px; margin-bottom:22px; }
.login-brand img{ display:block; width:min(300px,86%); height:auto; max-height:120px; margin:0 auto; padding:6px 10px; object-fit:contain; background:#fff; border-radius:10px; }
.login-brand h1{ font-size:20px; }
.login-brand p{ margin:2px 0 0; color:var(--muted); font-size:14px; }
.hint{ margin-top:16px; padding:10px 12px; font-size:13px; color:var(--muted); background:var(--surface-2); border-radius:8px; }
.hint button{ margin:4px 6px 0 0; padding:3px 10px; font-size:13px; color:var(--brand); background:var(--brand-soft); border:0; border-radius:999px; }

/* ---------- form ---------- */
.field{ display:block; margin-bottom:14px; }
.field > span, .field-label{ display:block; margin-bottom:5px; font-size:13px; font-weight:600; color:var(--muted); }
.field small{ display:block; margin-top:4px; font-size:12px; color:var(--muted); }
input[type=text],input[type=password],input[type=number],input[type=email],input[type=date],input[type=search],select,textarea{
  width:100%; min-height:42px; padding:8px 12px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; }
textarea{ min-height:76px; resize:vertical; }
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent); }
input[type=checkbox]{ width:18px; height:18px; accent-color:var(--brand); vertical-align:middle; }
.check{ display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:0 14px; }
.grid3{ display:grid; grid-template-columns:repeat(3,1fr); gap:0 14px; }
@media (max-width:560px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.money{ text-align:right; font-variant-numeric:tabular-nums; }
.form-error{ margin:10px 0 0; padding:9px 12px; font-size:14px; color:var(--danger); background:var(--danger-bg); border-radius:8px; }

/* ---------- tombol ---------- */
.btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:40px; padding:0 16px; font-weight:600; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:8px; text-decoration:none; white-space:nowrap; }
.btn:hover:not(:disabled){ background:var(--surface-2); }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.btn-primary{ color:var(--brand-ink); background:var(--brand); border-color:var(--brand); } .btn-primary:hover:not(:disabled){ background:color-mix(in srgb,var(--brand) 88%,#000); }
.btn-pay{ color:#fff; background:var(--pay); border-color:var(--pay); } .btn-pay:hover:not(:disabled){ background:var(--pay-hover); }
.btn-danger{ color:#fff; background:var(--danger); border-color:var(--danger); } .btn-danger:hover:not(:disabled){ background:color-mix(in srgb,var(--danger) 85%,#000); }
.btn-ghost{ background:transparent; } .btn-sm{ min-height:32px; padding:0 10px; font-size:13px; }
.btn-link{ min-height:0; padding:0; color:var(--brand); background:none; border:0; font-weight:600; }
.btn-link:hover{ text-decoration:underline; }

/* ---------- topbar ---------- */
.topbar{ min-height:56px; position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:14px; padding:8px 16px; color:var(--bar-ink); background:var(--bar); }
.brand{ display:flex; align-items:center; gap:10px; min-width:0; max-width:300px; }
.brand-mark{ flex:none; display:grid; place-items:center; min-width:38px; height:38px; padding:0 6px; border-radius:9px; background:var(--lcd-ink); color:#0b1424; font-weight:800; font-size:14px; }
.brand-logo{ flex:none; height:38px; width:auto; max-width:110px; padding:3px 5px; object-fit:contain; background:#fff; border-radius:8px; }
.brand-name{ min-width:0; line-height:1.15; } .brand-name b{ display:block; overflow:hidden; font-size:15px; text-overflow:ellipsis; white-space:nowrap; } .brand-name small{ display:block; font-size:12px; opacity:.65; }
.who{ position:relative; }
.who-btn{ display:flex; align-items:center; gap:8px; min-height:40px; padding:0 10px; color:var(--bar-ink); background:transparent; border:1px solid var(--bar-line); border-radius:8px; text-align:left; }
.who-btn:hover{ background:rgba(255,255,255,.07); }
.who-btn b{ display:block; font-size:14px; line-height:1.1; } .who-btn small{ display:block; font-size:11px; opacity:.65; }
.menu{ position:absolute; right:0; top:calc(100% + 6px); z-index:50; min-width:200px; padding:6px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); }
.menu button{ display:block; width:100%; padding:9px 12px; text-align:left; background:none; border:0; border-radius:6px; }
.menu button:hover{ background:var(--surface-2); }
.menu hr{ margin:4px 0; border:0; border-top:1px solid var(--line); }
@media (max-width:820px){ .brand-name,.who-btn span.w{ display:none; } .brand{ max-width:130px; } .topbar{ gap:8px; padding:8px 10px; } }

.net{ flex:none; display:inline-flex; align-items:center; gap:7px; min-height:34px; padding:0 12px; font-size:13px; font-weight:700; color:var(--bar-ink); background:transparent; border:1px solid var(--bar-line); border-radius:999px; white-space:nowrap; }
.net:hover{ background:rgba(255,255,255,.07); }
.net i{ width:9px; height:9px; border-radius:50%; background:#22c55e; box-shadow:0 0 0 3px rgba(34,197,94,.22); }
.net.off i{ background:#f59e0b; box-shadow:0 0 0 3px rgba(245,158,11,.25); }
.net.sync i{ background:#60a5fa; box-shadow:0 0 0 3px rgba(96,165,250,.25); animation:netp 1s ease-in-out infinite alternate; }
.net .n{ min-width:20px; padding:0 6px; line-height:18px; font-size:11px; text-align:center; color:#0b1424; background:#fbbf24; border-radius:999px; }
@keyframes netp{ from{ opacity:.35; } to{ opacity:1; } }
@media (max-width:820px){ .net .t{ display:none; } .net{ padding:0 10px; } }
.off-banner{ display:flex; gap:10px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px; font-size:14px; color:var(--warn); background:var(--warn-bg); border-bottom:1px solid color-mix(in srgb,var(--warn) 25%,transparent); }
.note-off{ margin:0 0 12px; padding:10px 12px; font-size:13px; color:var(--warn); background:var(--warn-bg); border-radius:10px; }
.q-list{ display:flex; flex-direction:column; gap:8px; margin-top:12px; max-height:46vh; overflow:auto; }
.q-item{ display:grid; grid-template-columns:1fr auto; gap:4px 12px; align-items:center; padding:10px 12px; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; }
.q-item small{ display:block; color:var(--muted); } .q-item .err{ grid-column:1/-1; font-size:13px; color:var(--danger); }
.q-item .acts{ grid-column:1/-1; display:flex; gap:6px; flex-wrap:wrap; }
.net-state{ display:flex; gap:12px; align-items:center; padding:12px 14px; border-radius:12px; background:var(--surface-2); }
.net-state b{ display:block; font-size:16px; } .net-state small{ color:var(--muted); }
.demo-note button{ margin-left:10px; padding:3px 12px; font-size:13px; font-weight:700; border-radius:999px; border:1px solid currentColor; background:transparent; color:inherit; cursor:pointer; }
.demo-note button[aria-pressed=true]{ color:#0b1424; background:#fbbf24; border-color:#fbbf24; }
.pwd-banner{ display:flex; gap:12px; align-items:center; justify-content:center; flex-wrap:wrap; padding:8px 12px; font-size:14px; color:var(--warn); background:var(--warn-bg); }

/* ---------- halaman admin ---------- */
.page{ width:100%; max-width:1280px; margin:0 auto; padding:20px 16px 48px; }
.page-head{ display:flex; align-items:flex-end; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
.page-head h1{ font-size:24px; } .page-head p{ margin:4px 0 0; color:var(--muted); }
.actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.card-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; padding:14px 16px; border-bottom:1px solid var(--line); }
.card-head h2{ font-size:16px; } .card-body{ padding:16px; }
.cols{ display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1fr); gap:14px; margin-top:14px; }
@media (max-width:980px){ .cols{ grid-template-columns:1fr; } }
.stack > * + *{ margin-top:14px; }

.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.chip{ min-height:34px; padding:0 13px; font-size:14px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; }
.chip:hover{ color:var(--ink); } .chip[aria-pressed=true]{ color:var(--brand-ink); background:var(--brand); border-color:var(--brand); }
.range{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; }
.range input[type=date]{ width:auto; min-height:34px; padding:2px 8px; }

.kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; }
@media (max-width:1100px){ .kpis{ grid-template-columns:repeat(3,1fr); } } @media (max-width:640px){ .kpis{ grid-template-columns:repeat(2,1fr); } }
.kpi{ padding:14px 16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.kpi span{ display:block; font-size:13px; color:var(--muted); }
.kpi b{ display:block; margin-top:4px; font-size:22px; line-height:1.15; overflow-wrap:anywhere; }
.kpi small{ display:block; margin-top:3px; font-size:12px; color:var(--muted); }
.kpi.dark{ background:var(--lcd); border-color:var(--lcd); } .kpi.dark span,.kpi.dark small{ color:#8fb3bf; } .kpi.dark b{ color:var(--lcd-ink); }
.up{ color:var(--ok); } .down{ color:var(--danger); }

.chart{ width:100%; height:auto; display:block; } .chart text{ font:11px var(--font); fill:var(--muted); } .chart .bar{ fill:var(--brand); } .chart .bar:hover{ fill:var(--lcd-ink); } .chart .grid{ stroke:var(--line); stroke-width:1; }
.hbar{ display:grid; grid-template-columns:96px 1fr auto; gap:10px; align-items:center; padding:6px 0; font-size:14px; }
.hbar i{ display:block; height:10px; border-radius:5px; background:var(--brand); min-width:2px; } .hbar .track{ height:10px; border-radius:5px; background:var(--surface-2); }


/* ---------- pratinjau struk ---------- */
.rc-preview{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:16px;align-items:start}
.rc-preview-paper{display:flex;justify-content:center;padding:18px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;overflow:auto}
.rc-preview-paper .receipt{box-shadow:0 8px 24px rgba(0,0,0,.12)}
.rc-paper-options{display:grid;gap:10px}
.rc-paper-option{display:flex;gap:9px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.rc-paper-option:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.rc-paper-option input{margin-top:3px;accent-color:var(--brand)}
.rc-paper-option b{display:block}
.rc-paper-option small{display:block;color:var(--muted);margin-top:2px}
@media(max-width:760px){.rc-preview{grid-template-columns:1fr}}

/* ---------- tabel ---------- */
.tscroll{ overflow-x:auto; }
table.t{ width:100%; border-collapse:collapse; font-size:14px; }
.t th,.t td{ padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; }
.t th{ position:sticky; top:0; font-size:12.5px; font-weight:700; color:var(--muted); background:var(--surface-2); white-space:nowrap; }
.t td.num,.t th.num{ text-align:right; } .t tbody tr:hover{ background:color-mix(in srgb,var(--brand) 5%,transparent); }
.t tr.sel{ background:var(--brand-soft) !important; }
.t .cbx{ width:42px; text-align:center; }
.t td small{ display:block; color:var(--muted); font-size:12px; }
.t tfoot td{ font-weight:700; background:var(--surface-2); }
.empty{ padding:36px 16px; text-align:center; color:var(--muted); } .empty strong{ display:block; margin-bottom:4px; color:var(--ink); }
.badge{ display:inline-block; padding:1px 9px; font-size:12px; font-weight:700; border-radius:999px; color:var(--muted); background:var(--surface-2); border:1px solid var(--line); }
.badge.ok{ color:var(--ok); background:var(--ok-bg); border-color:transparent; } .badge.warn{ color:var(--warn); background:var(--warn-bg); border-color:transparent; }
.badge.danger{ color:var(--danger); background:var(--danger-bg); border-color:transparent; } .badge.brand{ color:var(--brand); background:var(--brand-soft); border-color:transparent; }
.toolbar{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--line); }
.toolbar input[type=search]{ flex:1; min-width:180px; max-width:340px; } .toolbar select{ width:auto; }
.selbar{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding:9px 16px; color:var(--brand); background:var(--brand-soft); border-bottom:1px solid var(--line); font-weight:600; }

/* ---------- modal & toast ---------- */
.modal{ position:fixed; z-index:100; inset:0; display:flex; align-items:flex-start; justify-content:center; padding:5vh 12px 12px; overflow-y:auto; background:rgba(8,14,26,.55); }
.modal-card{ width:min(520px,100%); background:var(--surface); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; }
.modal-card.wide{ width:min(860px,100%); } .modal-card.xl{ width:min(900px,100%); }
.modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 18px; border-bottom:1px solid var(--line); }
.modal-head h2{ font-size:18px; } .modal-x{ width:34px; height:34px; font-size:20px; line-height:1; color:var(--muted); background:none; border:0; border-radius:8px; } .modal-x:hover{ background:var(--surface-2); }
.modal-body{ padding:18px; } .modal-foot{ display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; padding:12px 18px; background:var(--surface-2); border-top:1px solid var(--line); }
.toasts{ position:fixed; z-index:300; right:14px; top:calc(70px + env(safe-area-inset-top,0px)); display:flex; flex-direction:column; gap:8px; align-items:flex-end; pointer-events:none; }
.toast{ max-width:min(380px,92vw); padding:11px 16px; color:#fff; background:#1b2436; border-radius:10px; box-shadow:var(--shadow); font-size:14px; animation:tin .18s ease-out; }
.toast.err{ background:#b3261e; } .toast.ok{ background:#146c38; }
@keyframes tin{ from{ transform:translateY(-8px); opacity:0; } }
@media (prefers-reduced-motion:reduce){ *{ animation:none !important; transition:none !important; } }

.seg{ display:inline-flex; padding:3px; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; }
.seg button{ min-height:34px; padding:0 16px; font-weight:600; color:var(--muted); background:none; border:0; border-radius:7px; }
.seg button[aria-pressed=true]{ color:var(--ink); background:var(--surface); box-shadow:0 1px 3px rgba(0,0,0,.18); }
.rolepick{ display:grid; gap:8px; }
.rolepick label{ display:flex; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:9px; cursor:pointer; }
.rolepick label:has(input:checked){ border-color:var(--brand); background:var(--brand-soft); }
.rolepick b{ display:block; } .rolepick small{ color:var(--muted); }

.side{ background:var(--surface); border-right:1px solid var(--line); }

.side nav button{ position:relative; border-radius:12px; transition:background .15s,color .15s; }
.side nav button .ic{ box-sizing:content-box; padding:7px; border-radius:10px; background:var(--surface-2); opacity:1; color:var(--muted); transition:inherit; }
.side nav button:hover .ic{ color:var(--brand); background:var(--brand-soft); }
.side nav button[aria-current=page]{ color:var(--ink); background:var(--brand-soft); }
.side nav button[aria-current=page] .ic{ color:#fff; background:var(--brand); box-shadow:0 6px 14px -6px var(--brand); }
.side nav button[aria-current=page]::before{ content:''; position:absolute; left:-10px; top:10px; bottom:10px; width:4px; border-radius:0 4px 4px 0; background:var(--brand); }

/* halaman */
.page-head h1{ font-size:27px; font-weight:750; }
.page-head h1::after{ content:''; display:block; width:36px; height:4px; margin-top:8px; border-radius:4px; background:var(--brand); }
.card{ border-radius:var(--r); box-shadow:var(--shadow-sm); border-color:color-mix(in srgb,var(--line) 70%,transparent); }
.card-head h2{ font-size:16px; font-weight:700; }
.chip{ display:inline-flex; align-items:center; gap:7px; transition:all .15s; }
.chip[aria-pressed=true]{ background:var(--brand); border-color:transparent; box-shadow:0 6px 14px -8px var(--brand); }
.chip .dot{ width:9px; height:9px; border-radius:50%; background:hsl(var(--h) 70% 50%); }
.chip[aria-pressed=true] .dot{ background:#fff; }

/* KPI */
.kpi{ position:relative; overflow:hidden; padding:16px 16px 14px; border-radius:var(--r); box-shadow:var(--shadow-sm); border-color:color-mix(in srgb,var(--line) 70%,transparent); }
.kpi .ki{ display:grid; place-items:center; width:38px; height:38px; margin-bottom:10px; border-radius:12px; color:var(--kc,var(--brand)); background:color-mix(in srgb,var(--kc,var(--brand)) 14%,transparent); }
.kpi .ki svg{ width:20px; height:20px; }
.kpi b{ font-family:var(--font-d); font-size:23px; font-weight:750; }
.kpi::after{ content:''; position:absolute; right:-26px; top:-26px; width:90px; height:90px; border-radius:50%; background:color-mix(in srgb,var(--kc,var(--brand)) 9%,transparent); }
.kpi.k2{ --kc:#3b82f6; } .kpi.k3{ --kc:#a855f7; } .kpi.k4{ --kc:var(--ok); } .kpi.k5{ --kc:var(--accent); }
.kpi.dark{ color:#fff; border:0; background:var(--bar); }
.kpi.dark .ki{ color:var(--bar); background:var(--lcd-ink); } .kpi.dark::after{ background:rgba(126,240,200,.08); width:140px; height:140px; }
.kpi.dark span,.kpi.dark small{ color:#a9c9bf; } .kpi.dark b{ color:var(--lcd-ink); }
.kpi.dark .up{ color:#7ef0c8; } .kpi.dark .down{ color:#ffb199; }

/* grafik */
.chart .bar{ fill:var(--brand); } .chart .bar.last{ fill:var(--accent); } .chart .bar:hover{ fill:var(--brand-2); }
.hbar i{ background:var(--brand); }
.hbar:nth-child(2) i{ background:#3b82f6; } .hbar:nth-child(3) i{ background:#a855f7; }
.hbar:nth-child(4) i{ background:var(--accent); } .hbar:nth-child(5) i{ background:#ef4444; }
.share i{ background:var(--brand); }

/* tabel */
.t th{ font-size:11.5px; letter-spacing:.05em; text-transform:uppercase; background:color-mix(in srgb,var(--surface-2) 80%,var(--surface)); }
.t tbody tr{ transition:background .12s; }
.t tbody tr:nth-child(even){ background:color-mix(in srgb,var(--surface-2) 45%,transparent); }
.t tbody tr:hover{ background:color-mix(in srgb,var(--brand) 7%,transparent); }
.badge{ padding:2px 10px; }
.empty::before{ content:''; display:block; width:54px; height:54px; margin:0 auto 12px; border-radius:18px; background:var(--brand-soft); }

/* modal & toast */
.modal{ background:rgba(6,20,16,.55); backdrop-filter:blur(3px); }
.modal-card{ border-radius:18px; animation:pop .18s ease-out; }
@keyframes pop{ from{ transform:translateY(10px) scale(.985); opacity:0; } }
.modal-head{ background:var(--surface); }
.toast{ border-radius:12px; background:var(--bar); } .toast.ok{ background:#0b7a4b; } .toast.err{ background:#b3261e; }
.seg{ border-radius:12px; } .seg button{ border-radius:9px; }

/* ---------- kasir ---------- */
.cart-panel,.catalog-panel{ border-radius:18px; box-shadow:var(--shadow-sm); border-color:color-mix(in srgb,var(--line) 70%,transparent); }
.cart-head h2,.catalog-head{ font-family:var(--font-d); }
.pill{ color:#fff; background:var(--brand); }
.cust-btn{ border-radius:12px; border-style:dashed; }
.cust-btn.on{ border-style:solid; }
.cart-line{ grid-template-columns:auto 1fr auto; gap:2px 12px; align-items:start; }
.cart-line .thumb{ grid-row:1/3; width:40px; height:40px; font-size:14px; border-radius:11px; }
.cart-line .sub{ grid-column:3; } .cart-line .ctl{ grid-column:2/4; }
.cart-line:nth-child(odd){ background:color-mix(in srgb,var(--surface-2) 40%,transparent); }
.qty{ border-radius:10px; } .qty button{ font-weight:700; color:var(--brand); }
.summary{ background:var(--surface-2); }
.lcd{ position:relative; overflow:hidden; padding:14px 16px; border-radius:14px; background:var(--lcd); box-shadow:inset 0 0 0 1px rgba(242,201,76,.14); }

.pay-btn{ color:var(--pay-ink); border-radius:14px; background:var(--pay); box-shadow:0 12px 24px -12px var(--pay); transition:transform .12s,box-shadow .15s; }
.pay-btn:hover:not(:disabled){ background:var(--pay-hover); transform:translateY(-1px); box-shadow:0 16px 28px -12px var(--pay); }
.pay-btn:disabled{ background:var(--line); color:var(--muted); box-shadow:none; opacity:1; }
.scan input{ border-radius:14px; border-color:color-mix(in srgb,var(--brand) 35%,var(--line)); background:var(--surface); }
.scan svg{ color:var(--brand); opacity:.9; }
.product-grid{ grid-template-columns:repeat(auto-fill,minmax(158px,1fr)); gap:12px; }
.pcard{ position:relative; gap:4px; min-height:0; padding:10px; border-radius:16px; border-color:color-mix(in srgb,var(--line) 70%,transparent); box-shadow:var(--shadow-sm); transition:transform .14s ease,box-shadow .16s ease,border-color .16s; }
.pcard:hover:not(:disabled){ transform:translateY(-2px); border-color:hsl(var(--h) 55% 55%); box-shadow:0 14px 26px -14px hsl(var(--h) 60% 35% / .55); }
.pcard:active:not(:disabled){ transform:translateY(0) scale(.99); }
.pcard .thumb{ width:100%; height:62px; margin-bottom:6px; font-size:22px; border-radius:12px; }
.pcard .pr{ font-family:var(--font-d); font-size:17px; color:var(--ink); }
.pcard .st{ display:inline-flex; align-self:flex-start; padding:1px 8px; border-radius:999px; background:var(--surface-2); }
.pcard .st.low{ color:var(--warn); background:var(--warn-bg); } .pcard .st.out{ color:var(--danger); background:var(--danger-bg); }
.thumb{ flex:none; display:grid; place-items:center; font-family:var(--font-d); font-weight:800; letter-spacing:.02em;
  color:hsl(var(--h) 65% 26%); background:hsl(var(--h) 85% 88%); }
:root[data-theme="dark"] .thumb{ color:hsl(var(--h) 80% 86%); background:hsl(var(--h) 45% 24%); }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .thumb{ color:hsl(var(--h) 80% 86%); background:hsl(var(--h) 45% 24%); } }
.pay-total,.done-change{ border-radius:14px; background:var(--lcd); }
.pay-total strong,.done-change strong{ font-family:var(--font-d); }
.method{ border-radius:12px; transition:all .15s; } .method[aria-pressed=true]{ color:#fff; background:var(--brand); border-color:transparent; box-shadow:0 8px 18px -10px var(--brand); }
.quick button{ border-radius:10px; } .quick button:hover{ color:var(--brand); border-color:var(--brand); background:var(--brand-soft); }
.done-head .check{ background:var(--brand); box-shadow:0 8px 20px -8px var(--brand); }
@media (max-width:900px){ .pane-switch button{ border-radius:14px; } .pane-switch button.pri{ background:var(--brand); } }

/* ---------- login ---------- */

.login-wrap{ width:min(920px,100%); display:grid; grid-template-columns:1.05fr 1fr; overflow:hidden; background:var(--surface); border-radius:24px; box-shadow:var(--shadow); }

@media (max-width:760px){

}

/* pengaturan warna tema */
.th-presets{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:10px; }
.th-preset{ display:flex; flex-direction:column; gap:8px; padding:10px; text-align:left; font-weight:600; font-size:13px; background:var(--surface); border:2px solid var(--line); border-radius:14px; transition:border-color .15s,transform .12s; }

.th-preset[aria-pressed=true]{ border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 20%,transparent); }

<script>
window.KASIRKU_DEMO = (function () {
/**
 * PinaPos - core.js (versi JavaScript untuk demo; server asli memakai app/Core.php)
 * Logika bisnis (login, kasir, produk, pelanggan, user, laporan).
 * File ini TIDAK memanggil layanan Google secara langsung; semua akses data dan
 * kripto lewat objek "platform" (lihat Code.gs). Karena itu file yang sama juga
 * dipakai oleh demo di browser.
 */

var APP_VERSION = '1.0.0';
var TZ_HOURS = 7;            // WIB (UTC+7)
var SESSION_HOURS = 12;      // masa berlaku login
var METHODS = ['cash', 'transfer', 'debit', 'credit', 'qris'];
var ROLES = ['admin', 'kasir']; // admin = "Kasir Admin", kasir = "Kasir" biasa

// Skema tabel. Tipe kolom: n = angka, s = teks, b = ya/tidak (disimpan 1/0)
var SCHEMA = {
  Users: [['id','n'],['username','s'],['salt','s'],['pass_hash','s'],['full_name','s'],['role','s'],['active','b'],['last_login','s'],['created_at','s']],
  Categories: [['id','n'],['name','s']],
  Products: [['id','n'],['type','s'],['category','s'],['sku','s'],['barcode','s'],['name','s'],['unit','s'],['cost_price','n'],['price','n'],['stock','n'],['min_stock','n'],['track_stock','b'],['created_at','s']],
  Customers: [['id','n'],['name','s'],['phone','s'],['email','s'],['address','s'],['created_at','s']],
  Transactions: [['id','n'],['invoice_no','s'],['date','s'],['user_id','n'],['user_name','s'],['customer_id','n'],['customer_name','s'],['customer_addr','s'],['subtotal','n'],['discount_type','s'],['discount_value','n'],['discount_amount','n'],['tax_rate','n'],['tax_amount','n'],['grand_total','n'],['method','s'],['amount_paid','n'],['change','n'],['status','s'],['note','s'],['client_ref','s'],['source','s']],
  TxItems: [['id','n'],['tx_id','n'],['invoice_no','s'],['date','s'],['user_id','n'],['product_id','n'],['name','s'],['type','s'],['qty','n'],['price','n'],['cost','n'],['subtotal','n']],
  StockLog: [['id','n'],['date','s'],['product_id','n'],['name','s'],['user_name','s'],['type','s'],['change','n'],['before','n'],['after','n'],['note','s']],
  Settings: [['key','s'],['value','s']],
};

var SETTING_DEFAULTS = {
  store_name: 'PinaPos', store_address: '', store_phone: '', store_email: '', tax_no: '',
  bank_name: '', bank_account: '', bank_holder: '',
  tax_rate: '0', paper_width: '80', receipt_footer: 'Terima kasih atas kunjungan Anda.',
  show_logo_on_receipt: '1', auto_print: '0', inv_code: '200', inv_year: '', inv_next: '1',
  theme_brand: '', theme_accent: '', theme_pay: '', theme_bar: ''
};

/* ---------------- util tanggal & angka ---------------- */
function pad_(n, w) { var s = String(n); while (s.length < w) { s = '0' + s; } return s; }
function wib_(d) {
  var t = new Date(d.getTime() + TZ_HOURS * 3600000);
  return { y: t.getUTCFullYear(), m: t.getUTCMonth() + 1, d: t.getUTCDate(), h: t.getUTCHours(), i: t.getUTCMinutes(), s: t.getUTCSeconds() };
}
function ymd_(p) { return p.y + '-' + pad_(p.m, 2) + '-' + pad_(p.d, 2); }
function fmtDate_(d) { return ymd_(wib_(d)); }
function fmtDateTime_(d) { var p = wib_(d); return ymd_(p) + ' ' + pad_(p.h, 2) + ':' + pad_(p.i, 2) + ':' + pad_(p.s, 2); }
function isYmd_(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
function addDays_(s, n) {
  var a = s.split('-');
  var t = new Date(Date.UTC(+a[0], +a[1] - 1, +a[2] + n));
  return t.getUTCFullYear() + '-' + pad_(t.getUTCMonth() + 1, 2) + '-' + pad_(t.getUTCDate(), 2);
}
function diffDays_(a, b) { // b - a (hari)
  var x = a.split('-'), y = b.split('-');
  return Math.round((Date.UTC(+y[0], +y[1] - 1, +y[2]) - Date.UTC(+x[0], +x[1] - 1, +x[2])) / 86400000);
}
function round0_(v) { return Math.round(v); }
function round2_(v) { return Math.round(v * 100) / 100; }

/* ================================================================ */
function createBackend_(P) {
  var db = P.db;

  function fail(msg, code) { var e = new Error(msg); e.isApp = true; e.code = code || 'ERR'; throw e; }

  /* ---------- validasi ---------- */
  function str(v, max, label, required) {
    var s = (v === null || v === undefined) ? '' : String(v).replace(/\r/g, '').replace(/[\u0000-\u0009\u000b-\u001f]/g, ' ').trim();
    if (required && !s) { fail(label + ' wajib diisi.'); }
    if (s.length > max) { fail(label + ' terlalu panjang (maksimal ' + max + ' karakter).'); }
    return s;
  }
  function num(v, label, min, max) {
    var n = Number(v);
    if (v === '' || v === null || v === undefined || !isFinite(n)) { fail(label + ' harus berupa angka.'); }
    if (n < min) { fail(label + ' tidak boleh kurang dari ' + min + '.'); }
    if (n > max) { fail(label + ' terlalu besar.'); }
    return n;
  }
  function int(v, label, min, max) {
    var n = num(v, label, min, max);
    if (Math.floor(n) !== n) { fail(label + ' harus bilangan bulat.'); }
    return n;
  }
  function idList(v) {
    if (!Array.isArray(v) || !v.length) { fail('Tidak ada data yang dipilih.'); }
    if (v.length > 1000) { fail('Terlalu banyak data dipilih sekaligus (maksimal 1000).'); }
    return v.map(function (x) { return refId(x, 'ID'); });
  }
  // ID rujukan ke baris lain (mis. product_id, customer_id, atau id baris yang diedit/dihapus).
  // Server SELALU memberi id positif, tapi mesin offline (PWA) sementara memberi id NEGATIF
  // untuk baris yang baru dibuat di perangkat & belum tersinkron -- supaya kasir/produk/dst
  // tetap bisa dipakai (dan saling berelasi) sepenuhnya offline sebelum ada koneksi internet.
  // Karena itu rentang di sini sengaja mencakup negatif; server sendiri tidak pernah menerima
  // id negatif sungguhan karena mesin offline menuliskan ulang semua id sementara ini menjadi
  // id asli dari server sesaat setelah tersinkron (lihat rewriteRefs_ di engine.js).
  function refId(v, label) {
    var n = int(v, label, -1e12, 1e12);
    if (n === 0) { fail(label + ' tidak valid.'); }
    return n;
  }

  /* ---------- kripto ---------- */
  function hashPw(salt, pw) {
    var h = pw;
    for (var i = 0; i < 100; i++) { h = P.sha256(salt + ':' + h + ':' + pw); }
    return h;
  }
  function newSalt() { return P.sha256(P.secret() + ':' + Math.random() + ':' + new Date().getTime()).slice(0, 24); }
  function sign(msg) { var s = P.secret(); return P.sha256(s + ':' + P.sha256(s + ':' + msg)).slice(0, 40); }
  function makeToken(u) {
    var exp = Math.floor(P.now().getTime() / 1000) + SESSION_HOURS * 3600;
    var body = u.id + '.' + exp + '.' + u.pass_hash.slice(0, 8);
    return body + '.' + sign(body);
  }
  function authUser(token, roles) {
    var t = String(token || '').split('.');
    if (t.length !== 4) { fail('Sesi berakhir. Silakan masuk kembali.', 'AUTH'); }
    var body = t[0] + '.' + t[1] + '.' + t[2];
    if (sign(body) !== t[3]) { fail('Sesi tidak valid. Silakan masuk kembali.', 'AUTH'); }
    if (Number(t[1]) < Math.floor(P.now().getTime() / 1000)) { fail('Sesi berakhir. Silakan masuk kembali.', 'AUTH'); }
    var u = db.all('Users').filter(function (x) { return x.id === Number(t[0]); })[0];
    if (!u || !u.active || u.pass_hash.slice(0, 8) !== t[2]) { fail('Sesi tidak valid. Silakan masuk kembali.', 'AUTH'); }
    if (roles && roles.indexOf(u.role) < 0) { fail('Anda tidak memiliki hak akses untuk fitur ini.', 'FORBIDDEN'); }
    return u;
  }

  /* ---------- pengaturan ---------- */
  function currentYY() { return pad_(wib_(P.now()).y % 100, 2); }
  function loadSettings() {
    var kv = db.kv(), s = {}, k;
    for (k in SETTING_DEFAULTS) { s[k] = Object.prototype.hasOwnProperty.call(kv, k) ? kv[k] : SETTING_DEFAULTS[k]; }
    var parts = [], i = 0;
    while (kv['store_logo_' + i] !== undefined && kv['store_logo_' + i] !== '') { parts.push(kv['store_logo_' + i]); i++; }
    var yy = currentYY();
    var qrisReady = kv['qris_image_0'] !== undefined && kv['qris_image_0'] !== '';
    var next = (kv.inv_year === yy) ? (Number(kv.inv_next) || 1) : 1;
    return {
      store_name: s.store_name, store_address: s.store_address, store_phone: s.store_phone, store_email: s.store_email,
      tax_no: s.tax_no, bank_name: s.bank_name, bank_account: s.bank_account, bank_holder: s.bank_holder,
      tax_rate: Number(s.tax_rate) || 0, paper_width: Number(s.paper_width) === 58 ? 58 : 80,
      receipt_footer: s.receipt_footer, show_logo_on_receipt: s.show_logo_on_receipt === '1',
      auto_print: s.auto_print === '1', inv_code: s.inv_code || '200', inv_next: next, inv_yy: yy,
      inv_preview: yy + '-' + (s.inv_code || '200') + '-' + pad_(next, 6),
      store_logo: parts.join(''), qris_ready: qrisReady,
      theme: { brand: s.theme_brand, accent: s.theme_accent, pay: s.theme_pay, bar: s.theme_bar }
    };
  }
  function invoiceEligible(t) {
    return t.customer_id > 0 && (t.method === 'cash' || t.method === 'transfer') && t.status === 'completed';
  }

  /* ---------- bentuk data keluar ---------- */
  function pubUser(u) { return { id: u.id, username: u.username, full_name: u.full_name, role: u.role }; }
  function pubProduct(p, withCost) {
    var o = { id: p.id, type: p.type, category: p.category, sku: p.sku, barcode: p.barcode, name: p.name, unit: p.unit,
              price: p.price, stock: p.stock, min_stock: p.min_stock, track_stock: p.track_stock };
    if (withCost) { o.cost_price = p.cost_price; }
    return o;
  }
  function pubCustomer(c) { return { id: c.id, name: c.name, phone: c.phone, email: c.email, address: c.address }; }
  function txPayload(t, items) {
    return {
      id: t.id, invoice_no: t.invoice_no, date: t.date, user_id: t.user_id, cashier: t.user_name,
      customer_id: t.customer_id, customer: t.customer_name, customer_addr: t.customer_addr,
      items: items.map(function (i) { return { product_id: i.product_id, name: i.name, type: i.type, qty: i.qty, price: i.price, subtotal: i.subtotal }; }),
      subtotal: t.subtotal, discount_type: t.discount_type, discount_value: t.discount_value, discount_amount: t.discount_amount,
      tax_rate: t.tax_rate, tax_amount: t.tax_amount, grand_total: t.grand_total, method: t.method,
      amount_paid: t.amount_paid, change: t.change, status: t.status, note: t.note, invoice_eligible: invoiceEligible(t), offline: t.source === 'offline'
    };
  }
  function txSummary(t) {
    return { id: t.id, invoice_no: t.invoice_no, date: t.date, user_id: t.user_id, cashier: t.user_name, customer: t.customer_name,
             method: t.method, grand_total: t.grand_total, status: t.status, invoice_eligible: invoiceEligible(t), offline: t.source === 'offline' };
  }

  /* ---------- hitung total (dipakai checkout & data contoh) ---------- */
  function computeTotals(subtotal, discType, discValue, taxRate) {
    var disc = 0;
    if (discType === 'percent') { disc = round0_(subtotal * discValue / 100); }
    else if (discType === 'amount') { disc = round0_(discValue); }
    disc = Math.min(disc, subtotal);
    var taxable = subtotal - disc;
    var tax = round0_(taxable * taxRate / 100);
    return { discount: disc, tax: tax, grand: taxable + tax };
  }
  function invoiceNo(yy, code, seq) { return yy + '-' + code + '-' + pad_(seq, 6); }

  /* ================================================================
     AKSI
     ================================================================ */
  var A = {};

  /* ----- publik ----- */
  A.publicInfo = { auth: false, run: function () {
    var s = loadSettings();
    return { store_name: s.store_name, store_logo: s.store_logo, theme: s.theme, version: APP_VERSION };
  } };

  A.login = { auth: false, write: true, run: function (p) {
    var uname = str(p.username, 50, 'Username', true).toLowerCase();
    var pw = String(p.password || '');
    var key = 'fail:' + uname;
    var fails = Number(P.cacheGet(key) || 0);
    if (fails >= 5) { fail('Terlalu banyak percobaan gagal. Coba lagi dalam 10 menit.', 'LOCK'); }
    var u = db.all('Users').filter(function (x) { return x.username.toLowerCase() === uname; })[0];
    if (!u || !u.active || hashPw(u.salt, pw) !== u.pass_hash) {
      P.cachePut(key, String(fails + 1), 600);
      fail('Username atau password salah.', 'LOGIN');
    }
    P.cachePut(key, '0', 1);
    db.update('Users', u.id, { last_login: fmtDateTime_(P.now()) });
    return { token: makeToken(u), user: pubUser(u), default_password: u.username === 'admin' && hashPw(u.salt, 'admin123') === u.pass_hash };
  } };

  /* ----- semua user yang login ----- */
  A.bootstrap = { roles: ['admin', 'kasir'], run: function (p, user) {
    return {
      user: pubUser(user),
      settings: loadSettings(),
      products: db.all('Products').map(function (p) { return pubProduct(p, false); }),
      categories: db.all('Categories').map(function (c) { return c.name; }),
      customers: db.all('Customers').map(pubCustomer),
      server_time: fmtDateTime_(P.now())
    };
  } };

  A.ping = { roles: ['admin', 'kasir'], run: function (p, user) { return { time: fmtDateTime_(P.now()), user_id: user.id }; } };

  A.checkout = { roles: ['admin', 'kasir'], write: true, run: function (p, user) {
    // ref = kode unik dari perangkat kasir -> kirim ulang tetap tercatat sekali.
    var o = (p.offline && typeof p.offline === 'object') ? p.offline : null;
    var ref = str(p.ref || (o ? o.ref : ''), 64, 'Ref transaksi', false);
    if (ref) {
      if (!/^[A-Za-z0-9_-]{8,64}$/.test(ref)) { fail('Ref transaksi tidak valid.'); }
      var dup = db.all('Transactions').filter(function (t) { return t.client_ref === ref; })[0];
      if (dup) { var dr = txPayload(dup, db.all('TxItems').filter(function (i) { return i.tx_id === dup.id; })); dr.duplicate = true; return dr; }
    }
    var off = null;
    if (o) {
      if (!ref) { fail('Transaksi offline wajib memiliki ref.'); }
      var odate = String(o.date || '');
      if (!/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}$/.test(odate)) { fail('Tanggal transaksi offline tidak valid.'); }
      var sid = refId(o.user_id, 'Kasir');
      if (sid !== user.id && user.role !== 'admin') { fail('Transaksi offline milik kasir lain hanya bisa disinkronkan oleh Kasir Admin.', 'FORBIDDEN'); }
      var seller = sid === user.id ? user : db.all('Users').filter(function (x) { return x.id === sid; })[0];
      if (!seller) { seller = { id: sid, full_name: String(o.user_name || ('User #' + sid)) }; }
      off = { date: odate, seller: seller, tax_rate: num(o.tax_rate || 0, 'Pajak', 0, 100) };
    }
    var raw = p.items;
    if (!Array.isArray(raw) || !raw.length) { fail('Keranjang masih kosong.'); }
    if (raw.length > 200) { fail('Terlalu banyak item dalam satu transaksi (maksimal 200).'); }
    var qtyById = {}, order = [], meta = {};
    raw.forEach(function (it) {
      var pid = refId(it && it.product_id, 'Produk');
      var q = int(it && it.qty, 'Jumlah', 1, 999999);
      if (!qtyById[pid]) { qtyById[pid] = 0; order.push(pid); if (off) { meta[pid] = { price: num(it.price, 'Harga', 0, 1e12), name: str(it.name, 150, 'Nama', false) }; } }
      qtyById[pid] += q;
    });

    var customer = null;
    if (p.customer_id) {
      var cid = refId(p.customer_id, 'Pelanggan');
      customer = db.all('Customers').filter(function (c) { return c.id === cid; })[0];
      if (!customer && !off) { fail('Pelanggan tidak ditemukan (mungkin sudah dihapus).'); }
    }
    var discType = p.discount_type || 'none';
    if (['none', 'percent', 'amount'].indexOf(discType) < 0) { fail('Jenis diskon tidak valid.'); }
    var discValue = 0;
    if (discType !== 'none') {
      discValue = num(p.discount_value || 0, 'Diskon', 0, 1e12);
      if (discType === 'percent' && discValue > 100) { fail('Diskon persen tidak boleh lebih dari 100.'); }
      if (discValue === 0) { discType = 'none'; }
    }
    var method = String(p.payment_method || '');
    if (METHODS.indexOf(method) < 0) { fail('Metode pembayaran tidak valid.'); }
    var note = str(p.note, 200, 'Catatan', false);

    var settings = loadSettings();
    var products = db.all('Products');
    var byId = {};
    products.forEach(function (x) { byId[x.id] = x; });

    var lines = [], subtotal = 0;
    order.forEach(function (pid) {
      var pr = byId[pid], q = qtyById[pid];
      if (!pr) {
        if (!off) { fail('Ada produk yang sudah dihapus. Muat ulang halaman kasir.'); }
        pr = { id: pid, name: meta[pid].name || ('Produk #' + pid), type: 'barang', price: 0, cost_price: 0, track_stock: false, stock: 0 };
      }
      if (!off && pr.track_stock && pr.stock < q) { fail('Stok "' + pr.name + '" tidak cukup (tersisa ' + pr.stock + ', diminta ' + q + ').'); }
      var price = off ? meta[pid].price : pr.price;
      var sub = round2_(price * q);
      subtotal += sub;
      lines.push({ pr: pr, qty: q, price: price, subtotal: sub });
    });
    subtotal = round2_(subtotal);
    var taxRate = off ? off.tax_rate : settings.tax_rate;
    var tot = computeTotals(subtotal, discType, discValue, taxRate);
    var paid = tot.grand, change = 0;
    if (method === 'cash') {
      paid = num(p.amount_paid || 0, 'Uang diterima', 0, 1e13);
      if (paid + 0.0001 < tot.grand) { fail('Uang yang diterima kurang dari total belanja.'); }
      change = round2_(paid - tot.grand);
    }

    // nomor invoice otomatis: YY-KODE-URUT6, urutan mulai 1 tiap tahun
    var now = P.now(), yy = currentYY();
    var kv = db.kv();
    var seq = (kv.inv_year === yy) ? (Number(kv.inv_next) || 1) : 1;
    var no = invoiceNo(yy, settings.inv_code, seq);

    var sl = off ? off.seller : user;
    var tx = db.insert('Transactions', {
      invoice_no: no, date: off ? off.date : fmtDateTime_(now), user_id: sl.id, user_name: sl.full_name,
      customer_id: customer ? customer.id : 0, customer_name: customer ? customer.name : '', customer_addr: customer ? customer.address : '',
      subtotal: subtotal, discount_type: discType, discount_value: discValue, discount_amount: tot.discount,
      tax_rate: taxRate, tax_amount: tot.tax, grand_total: tot.grand,
      method: method, amount_paid: paid, change: change, status: 'completed', note: note, client_ref: ref, source: off ? 'offline' : 'online'
    });
    var itemRows = lines.map(function (l) {
      return { tx_id: tx.id, invoice_no: no, date: tx.date, user_id: sl.id, product_id: l.pr.id, name: l.pr.name, type: l.pr.type,
               qty: l.qty, price: l.price, cost: l.pr.cost_price, subtotal: l.subtotal };
    });
    var saved = db.insertMany('TxItems', itemRows);
    lines.forEach(function (l) {

    });

      var m = methods[t.method] || (methods[t.method] = { method: t.method, tx: 0, sales: 0 });

function memoryDb_(state, onChange) {
  function coerce(t, o) {
    var out = {};
    SCHEMA[t].forEach(function (c) {
      var v = o[c[0]];
      if (c[1] === 'n') { v = (v === '' || v === null || v === undefined) ? 0 : (Number(v) || 0); }

      else { v = (v === null || v === undefined) ? '' : String(v); }
      out[c[0]] = v;
    });
    return out;
  }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  return {
    all: function (t) { return state.tables[t].map(clone); },
    insert: function (t, o) {
      var rows = state.tables[t], id = 0;
      rows.forEach(function (r) { if (r.id > id) { id = r.id; } });
      var row = coerce(t, Object.assign({}, o, { id: id + 1 }));
      rows.push(row); onChange(); return clone(row);
    },
    insertMany: function (t, arr) {
      var rows = state.tables[t], id = 0, out = [];
      rows.forEach(function (r) { if (r.id > id) { id = r.id; } });
      arr.forEach(function (o) { var row = coerce(t, Object.assign({}, o, { id: ++id })); rows.push(row); out.push(clone(row)); });
      onChange(); return out;
    },
    update: function (t, id, patch) {
      var row = state.tables[t].filter(function (r) { return r.id === id; })[0];
      if (!row) { return null; }
      var merged = coerce(t, Object.assign({}, row, patch, { id: id }));
      Object.keys(merged).forEach(function (k) { row[k] = merged[k]; });
      onChange(); return clone(row);
    },
    removeMany: function (t, ids) {
      var before = state.tables[t].length;
      state.tables[t] = state.tables[t].filter(function (r) { return ids.indexOf(r.id) < 0; });
      onChange(); return before - state.tables[t].length;
    },
    kv: function () { return clone(state.kv); },
    kvWrite: function (set, del) {
      Object.keys(set).forEach(function (k) { state.kv[k] = String(set[k]); });
      (del || []).forEach(function (k) { delete state.kv[k]; });
      onChange();
    }
  };
}

function createDemoBackend(storage, logoDataUrl, appMode) {
  var state = null, timer = null;
  function save() { if (timer) { return; } timer = setTimeout(function () { timer = null; try { storage.set(JSON.stringify(state)); } catch (e) {} }, 150); }
  function emptyState() {
    var t = {}; Object.keys(SCHEMA).forEach(function (k) { if (k !== 'Settings') { t[k] = []; } });
    return { v: 1, secret: sha256Hex_('demo' + Math.random() + Date.now()), tables: t, kv: {} };
  }
  var cache = {};
  var platform = {
    db: null,
    sha256: sha256Hex_,
    now: function () { return new Date(); },
    lock: function (fn) { return fn(); },
    secret: function () { return state.secret; },
    cacheGet: function (k) { var e = cache[k]; return (e && e.exp > Date.now()) ? e.v : null; },
    cachePut: function (k, v, sec) { cache[k] = { v: v, exp: Date.now() + sec * 1000 }; }
  };

  function build(fresh) {
    state = null;

    var seeded = false;
    if (!state) { state = emptyState(); seeded = true; }

    backend = createBackend_(platform);
    if (seeded) { if (appMode) { seedApp_(backend, platform); } else { seedDemo_(backend, platform, logoDataUrl); } }
    return backend;
  }
  build(false);
  return {
    handle: function (action, token, payload) { return backend.handle(action, token, payload); },
    reset: function () { try { storage.clear(); } catch (e) {} build(true); save(); },
    /* --- dipakai aplikasi Android (mode aplikasi, data milik toko) --- */
    flush: function () { if (timer) { clearTimeout(timer); timer = null; } try { storage.set(JSON.stringify(state)); } catch (e) { if (window.ksrStorageError) { window.ksrStorageError(e); } } },
    stats: function () { var t = state.tables; return { transactions: (t.Transactions || []).length, products: (t.Products || []).length, customers: (t.Customers || []).length }; },
    exportData: function () { var o = JSON.parse(JSON.stringify(state)); o.app = 'kasirku'; o.product = 'PinaPos'; o.exported_at = new Date().toISOString(); return o; },
    restoreData: function (b) {

}

      body: '<p style="margin:0 0 8px">' + o.message + '</p>' + (o.items && o.items.length ? '<ul class="muted" style="margin:8px 0 0;padding-left:20px">' + o.items.slice(0, 6).map(x => '<li>' + esc(x) + '</li>').join('') + (o.items.length > 6 ? '<li>dan ' + (o.items.length - 6) + ' lainnya…</li>' : '') + '</ul>' : ''),
      foot: '<button class="btn" data-no>Batal</button><button class="btn ' + (o.danger ? 'btn-danger' : 'btn-primary') + '" data-yes>' + esc(o.ok || 'Ya') + '</button>',
      onClose() { if (!done) { done = true; resolve(false); } }
    });

}

/* ---------- cetak (struk, invoice, laporan) ---------- */
function printDoc(html, pageCss) {
  if (ANDROID && ANDROID.print) {
    // Aplikasi Android: kirim dokumen lengkap ke layanan cetak Android (printer, RawBT, atau Simpan PDF)
    const css = $$('style').filter(x => x.id !== 'pageStyle').map(x => x.textContent).join('\n');
    const doc = '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>' + css +
      '\n@page{' + pageCss + '} html,body{display:block!important;min-height:0!important;height:auto!important;margin:0!important;padding:0!important;background:#fff!important;overflow:visible!important}</style></head><body>' + html + '</body></html>';
    try { ANDROID.print(doc, 'PinaPos'); } catch (e) { toast('Tidak dapat membuka layanan cetak: ' + e.message, 'err'); }
    return;
  }
  if (PRN.mode() !== 'browser' && /class="receipt\b/.test(html)) { return printThermalHtml(html, /class="receipt w58\b/.test(html) ? 58 : 80); }
  const root = $('#printRoot');
  root.innerHTML = html;
  $('#pageStyle').textContent = '@page{' + pageCss + '}';
  const imgs = $$('img', root).filter(i => !i.complete).map(i => new Promise(r => { i.onload = i.onerror = r; }));
  Promise.race([Promise.all(imgs), new Promise(r => setTimeout(r, 1500))]).then(() => {
    document.body.classList.add('printing');
    let closed = false, safety;
    const done = () => {
      if (closed) { return; }
      closed = true;
      clearTimeout(safety);
      document.body.classList.remove('printing'); root.innerHTML = '';
      window.removeEventListener('afterprint', done);
      window.removeEventListener('focus', onFocus);
    };
    const onFocus = () => setTimeout(done, 300);
    window.addEventListener('afterprint', done);
    window.addEventListener('focus', onFocus);
    // Jaring pengaman: di sebagian browser/iframe, "afterprint" atau fokus kembali
    // tidak selalu terpicu, sehingga tombol di balik layar cetak jadi tak terlihat/tidak
    // berfungsi. Batas waktu ini memastikan tampilan selalu kembali normal.
    safety = setTimeout(done, 6000);
    try { window.print(); }
    catch (e) { done(); toast('Browser memblokir cetak. Buka aplikasi di tab sendiri lalu coba lagi.', 'err'); }
  });
}

/* ======================================================================
 * PRINTER THERMAL: Bluetooth langsung (Web Bluetooth) / RawBT / dialog cetak
 * ----------------------------------------------------------------------
 * Dialog cetak browser (window.print) di Android TIDAK bisa melihat printer
 * thermal Bluetooth. Jadi setiap struk (<div class="receipt">) diubah menjadi
 * perintah ESC/POS lalu dikirim:
 *  - "bt"     : langsung ke printer lewat Web Bluetooth (Chrome/Edge, BLE)
 *  - "rawbt"  : lewat aplikasi Android RawBT (printer Bluetooth Classic)
 *  - "browser": perilaku lama, dialog cetak browser
 * Invoice/laporan A4 tetap memakai dialog cetak. Pilihan disimpan per perangkat.
 * ==================================================================== */
const PRN_PFX = 'ksr_';
const PRN = {
  mode() { const m = store.get(PRN_PFX + 'prn_mode'); return m === 'bt' || m === 'rawbt' ? m : 'browser'; },
  setMode(m) { store.set(PRN_PFX + 'prn_mode', m); },
  cols() { return Number(store.get(PRN_PFX + 'prn_cols')) || 0; },
  logo() { return store.get(PRN_PFX + 'prn_logo') !== '0'; }
};
const sleep = ms => new Promise(r => setTimeout(r, ms));
/** Printer thermal hanya paham ASCII: buang aksen & ganti simbol unicode. */
const asciiFold = s => String(s == null ? '' : s).normalize('NFKD').replace(/[̀-ͯ]/g, '')
  .replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/[–—]/g, '-')
  .replace(/[·•]/g, '-').replace(/…/g, '...').replace(/ /g, ' ').replace(/\t/g, ' ').replace(/[^\n\x20-\x7E]/g, '?');

class EscPos {
  constructor(paper) {
    this.paper = paper === 58 ? 58 : 80;
    this.cols = PRN.cols() || (this.paper === 58 ? 32 : 48);
    this.dots = this.paper === 58 ? 384 : 576;
    this.b = []; this.wide = 1;
  }
  raw(...a) { for (const x of a) { this.b.push(x & 255); } return this; }
  txt(s) { s = asciiFold(s); for (let i = 0; i < s.length; i++) { this.b.push(s.charCodeAt(i)); } return this; }
  ln(s) { return this.txt(s || '').raw(10); }
  init() { return this.raw(0x1B, 0x40); }
  center() { return this.raw(0x1B, 0x61, 1); }
  left() { return this.raw(0x1B, 0x61, 0); }
  bold(on) { return this.raw(0x1B, 0x45, on ? 1 : 0); }
  size(n) { this.wide = (n >> 4) + 1; return this.raw(0x1D, 0x21, n); }
  get w() { return Math.max(8, Math.floor(this.cols / this.wide)); }
  wrap(s) {
    const out = [], w = this.w;
    asciiFold(s).split(/\r?\n/).forEach(par => {
      let line = '';
      par.split(/\s+/).filter(Boolean).forEach(word => {
        while (word.length > w) { if (line) { out.push(line); line = ''; } out.push(word.slice(0, w)); word = word.slice(w); }
        if (!word) { return; }
        if (!line) { line = word; } else if (line.length + 1 + word.length <= w) { line += ' ' + word; } else { out.push(line); line = word; }
      });
      if (line) { out.push(line); }
    });
    return out;
  }
  lines(s) { this.wrap(s).forEach(l => this.ln(l)); return this; }
  /** Teks kiri & kanan dalam satu baris (kanan rata kanan). */
  lr(l, r) {
    l = asciiFold(l).replace(/\s+/g, ' ').trim(); r = asciiFold(r).replace(/\s+/g, ' ').trim(); const w = this.w;
    if (!r) { return this.lines(l); }
    if (l.length + 1 + r.length <= w) { return this.ln(l + ' '.repeat(w - l.length - r.length) + r); }
    this.wrap(l).forEach(x => this.ln(x));
    (r.length > w ? this.wrap(r) : [r]).forEach(x => this.ln(' '.repeat(Math.max(0, w - x.length)) + x));
    return this;
  }
  sep(ch) { return this.ln((ch || '-').repeat(this.w)); }
  feed(n) { return this.raw(0x1B, 0x64, n); }
  cut() { return this.raw(0x1D, 0x56, 0x42, 0x00); }
  barcode(v) {
    v = asciiFold(v).replace(/\s+/g, ''); if (!v) { return this; }
    const modules = 11 * (v.length + 3) + 2 + 20;
    const mw = Math.max(1, Math.min(3, Math.floor(this.dots / modules)));
    const data = '{B' + v;
    this.center().raw(0x1D, 0x68, 70, 0x1D, 0x77, mw, 0x1D, 0x48, 2, 0x1D, 0x66, 0, 0x1D, 0x6B, 73, data.length).txt(data);
    return this.raw(10).left();
  }
  /** Cetak logo sebagai gambar raster hitam-putih (dithering). Gagal = dilewati. */
  async logo(src, frac) {
    try {
      const img = await loadImg(src);
      const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
      if (!iw || !ih) { return this; }
      let w = Math.min(Math.round(this.dots * (frac || 0.6)), iw), h = Math.round(w * ih / iw);
      const maxH = Math.round(this.dots * 0.4);
      if (h > maxH) { w = Math.round(w * maxH / h); h = maxH; }
      w = Math.max(8, w); h = Math.max(1, h);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
      const d = x.getImageData(0, 0, w, h).data, g = new Float32Array(w * h);
      for (let i = 0; i < w * h; i++) { g[i] = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2]; }
      const bw = Math.ceil(w / 8), bits = new Uint8Array(bw * h);
      for (let yy = 0; yy < h; yy++) {
        for (let xx = 0; xx < w; xx++) {
          const i = yy * w + xx, o = g[i], n = o < 128 ? 0 : 255, e = o - n;
          if (n === 0) { bits[yy * bw + (xx >> 3)] |= 0x80 >> (xx & 7); }
          if (xx + 1 < w) { g[i + 1] += e * 7 / 16; }
          if (yy + 1 < h) { if (xx > 0) { g[i + w - 1] += e * 3 / 16; } g[i + w] += e * 5 / 16; if (xx + 1 < w) { g[i + w + 1] += e / 16; } }
        }
      }
      this.center();
      for (let y0 = 0; y0 < h; y0 += 64) {
        const hh = Math.min(64, h - y0);
        this.raw(0x1D, 0x76, 0x30, 0, bw & 255, bw >> 8, hh & 255, hh >> 8);
        for (let i = y0 * bw; i < (y0 + hh) * bw; i++) { this.b.push(bits[i]); }
      }
      return this.left();
    } catch (e) { return this; }
  }
  bytes() { return new Uint8Array(this.b); }
}

/** Ubah HTML struk (<div class="receipt">…) menjadi ESC/POS -- berlaku untuk semua jenis struk/nota. */
async function escFromReceiptHtml(html, paper) {
  const p = new EscPos(paper);
  p.init();
  const box = document.createElement('div'); box.innerHTML = html;
  const root = box.querySelector('.receipt') || box;
  const text = el => { const c = el.cloneNode(true); c.querySelectorAll('br').forEach(b => b.replaceWith('\n')); return c.textContent.replace(/[ \t]+/g, ' ').replace(/ *\n */g, '\n').trim(); };
  const walk = async (el, inCenter) => {
    for (const n of Array.from(el.children)) {
      const cl = n.classList, tag = n.tagName.toLowerCase();
      if (tag === 'img') { if (cl.contains('r-brandlogo')) { await p.logo(n.getAttribute('src'), 0.16); } else if (cl.contains('r-logo') && PRN.logo()) { await p.logo(n.getAttribute('src')); } continue; }
      if (tag === 'hr') { p.left().sep(cl.contains('solid') ? '=' : '-'); continue; }
      if (tag === 'svg') { p.barcode((n.getAttribute('aria-label') || '').replace(/^barcode\s*/i, '')); continue; }
      if (cl.contains('sr-barcode-text')) { continue; }
      if (cl.contains('r-row')) {
        const sp = n.children, big = cl.contains('r-total');
        p.left(); if (big) { p.bold(1).size(0x01); }
        p.lr(text(sp[0] || n), sp[1] ? text(sp[1]) : '');
        if (big) { p.size(0).bold(0); }
        continue;
      }
      const center = inCenter || cl.contains('r-center') || cl.contains('r-no') || cl.contains('r-lunas') || n.style.textAlign === 'center';
      if (n.querySelector('.r-row, hr, img, svg, .r-item, .r-name')) { await walk(n, center); continue; }
      const t = text(n); if (!t) { continue; }
      const huge = cl.contains('r-store') || cl.contains('r-no') || cl.contains('r-lunas');
      const bold = huge || cl.contains('r-name') || /bold|[6-9]00/.test(n.style.fontWeight);
      p[center ? 'center' : 'left']();
      if (bold) { p.bold(1); }
      if (huge) { p.size(0x11); }
      p.lines(t);
      if (huge) { p.size(0); }
      if (bold) { p.bold(0); }
      p.left();
    }
  };
  await walk(root, false);
  return p.feed(4).cut().bytes();
}

/* ----- koneksi Web Bluetooth (BLE) ----- */
const BT = {
  device: null, ch: null, chunk: 100,
  // Layanan GATT yang umum dipakai printer thermal murah (Xprinter, Zjiang, Goojprt, Panda, EPPOS, dll).
  SERVICES: [
    '000018f0-0000-1000-8000-00805f9b34fb', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2', '49535343-fe7d-4ae5-8fa9-9fafd205e455',
    '0000ff00-0000-1000-8000-00805f9b34fb', '0000ffe0-0000-1000-8000-00805f9b34fb', '0000fff0-0000-1000-8000-00805f9b34fb',
    '0000ae30-0000-1000-8000-00805f9b34fb', '0000ae00-0000-1000-8000-00805f9b34fb', '0000fee7-0000-1000-8000-00805f9b34fb',
    '0000e0ff-3c17-d293-8e48-14fe2e4da212', '0000ffb0-0000-1000-8000-00805f9b34fb'
  ],
  supported() { return !!(navigator.bluetooth && window.isSecureContext); },
  name() { return (this.device && this.device.name) || store.get(PRN_PFX + 'bt_name') || ''; },
  connected() { return !!(this.device && this.device.gatt && this.device.gatt.connected && this.ch); },
  _bind(d) {
    this.device = d; this.ch = null;
    store.set(PRN_PFX + 'bt_name', d.name || 'Printer tanpa nama'); store.set(PRN_PFX + 'bt_id', d.id || '');
    d.addEventListener('gattserverdisconnected', () => { this.ch = null; });
  },
  /** Harus dipanggil dari klik pengguna (aturan browser). */
  async pick() {
    if (!this.supported()) { throw new Error(btUnsupportedMsg()); }
    let d;
    try { d = await navigator.bluetooth.requestDevice({ acceptAllDevices: true, optionalServices: this.SERVICES }); }
    catch (e) {
      if (e.name === 'NotFoundError') { throw new Error('Pemilihan printer dibatalkan, atau tidak ada perangkat Bluetooth yang terdeteksi.'); }
      if (e.name === 'SecurityError') { throw new Error('Tekan tombol cetak / cari printer sekali lagi (browser meminta klik langsung dari Anda).'); }
      throw e;
    }
    if (this.device && this.device !== d) { try { this.device.gatt.disconnect(); } catch (e) {} }
    this._bind(d);
    await this.connect();
    return d;
  },
  /** Setelah halaman dimuat ulang, coba pakai lagi printer yang sudah diizinkan. */
  async restore() {
    if (this.device || !this.supported() || !navigator.bluetooth.getDevices) { return !!this.device; }
    try {
      const id = store.get(PRN_PFX + 'bt_id'), list = await navigator.bluetooth.getDevices();
      const d = list.find(x => x.id === id) || (list.length === 1 ? list[0] : null);
      if (d) { this._bind(d); return true; }
    } catch (e) {}
    return false;
  },
  async connect() {
    if (!this.device) { throw new Error('Printer Bluetooth belum dipilih.'); }
    if (this.connected()) { return this.ch; }
    let server, lastErr;
    for (let i = 0; i < 3 && !server; i++) {
      try { server = await this.device.gatt.connect(); } catch (e) { lastErr = e; await sleep(400); }
    }
    if (!server) { throw new Error('Tidak bisa tersambung ke "' + this.name() + '". Pastikan printer menyala & dekat. (' + (lastErr && lastErr.message || '') + ')'); }
    let services = [];
    try { services = await server.getPrimaryServices(); } catch (e) {}
    let pickCh = null;
    for (const sv of services) {
      let chars = [];
      try { chars = await sv.getCharacteristics(); } catch (e) { continue; }
      const c = chars.find(c => c.properties.writeWithoutResponse) || chars.find(c => c.properties.write);
      if (c) { pickCh = c; break; }
    }
    if (!pickCh) {
      try { this.device.gatt.disconnect(); } catch (e) {}
      throw new Error('Perangkat "' + this.name() + '" tersambung, tapi tidak punya jalur cetak BLE yang dikenali. Kemungkinan printer ini hanya Bluetooth Classic — gunakan mode "Aplikasi RawBT".');
    }
    this.ch = pickCh;
    return pickCh;
  },
  async _send(part) {
    const c = this.ch;
    if (c.properties.writeWithoutResponse && c.writeValueWithoutResponse) { await c.writeValueWithoutResponse(part); await sleep(Math.max(8, Math.round(part.length / 7))); }
    else if (c.writeValueWithResponse) { await c.writeValueWithResponse(part); }
    else { await c.writeValue(part); }
  },
  async write(bytes) {
    await this.connect();
    let i = 0;
    while (i < bytes.length) {
      const part = bytes.slice(i, i + this.chunk);
      try { await this._send(part); i += part.length; }
      catch (e) {
        if (this.chunk > 20) { this.chunk = 20; continue; }                                   // MTU kecil: perkecil potongan
        if (!this.device.gatt.connected) { this.ch = null; await this.connect(); continue; }   // putus: sambung ulang
        throw new Error('Gagal mengirim ke printer: ' + e.message);
      }
    }
  },
  forget() { try { if (this.device) { this.device.gatt.disconnect(); } } catch (e) {} this.device = null; this.ch = null; store.del(PRN_PFX + 'bt_id'); store.del(PRN_PFX + 'bt_name'); }
};
function btUnsupportedMsg() {
  if (typeof ANDROID !== 'undefined' && ANDROID) { return 'Di aplikasi Android (APK), struk dicetak lewat layanan cetak Android. Pilih mode "Dialog cetak browser", lalu pilih RawBT / printer Anda di layar cetak.'; }
  if (!window.isSecureContext) { return 'Bluetooth hanya jalan di alamat https:// atau localhost.'; }
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/.test(ua)) { return 'iPhone/iPad (Safari) belum mendukung Web Bluetooth. Gunakan HP Android dengan Chrome.'; }
  if (/FBAN|FBAV|Instagram|Line\/|WhatsApp|; wv\)/.test(ua)) { return 'Halaman dibuka di browser bawaan aplikasi lain. Buka di Google Chrome (menu ⋮ → Buka di Chrome).'; }
  if (/Firefox/.test(ua)) { return 'Firefox tidak mendukung Web Bluetooth. Gunakan Google Chrome atau Microsoft Edge.'; }
  return 'Browser ini tidak mendukung Web Bluetooth. Gunakan Google Chrome terbaru (Android / Windows).';
}

/* ----- kirim lewat aplikasi RawBT (Android) ----- */
function rawbtSend(bytes) {
  if (!/Android/i.test(navigator.userAgent)) { toast('Mode RawBT hanya untuk HP/tablet Android.', 'err'); return; }
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) { bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); }
  window.location.href = 'intent:base64,' + btoa(bin) + '#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
}

async function printThermalHtml(html, paper) {
  const mode = PRN.mode();

      if (!BT.supported()) { throw new Error(btUnsupportedMsg()); }
      if (!BT.device) { await BT.restore(); }
      if (!BT.device) { await BT.pick(); }            // pilih printer selagi masih dalam klik pengguna
    }
    const bytes = await escFromReceiptHtml(html, paper);
    if (mode === 'rawbt') { rawbtSend(bytes); return; }
    toast('Mengirim ke ' + BT.name() + '…');
    await BT.write(bytes);
    toast('Struk terkirim ke printer.', 'ok');
  } catch (e) {
    toast(e.message || String(e), 'err');
  }
}

/* ---------- pangkas ruang kosong di sekeliling logo ---------- */
function loadImg(src) { return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Gambar tidak dapat dibaca.')); i.src = src; }); }
/** Mengembalikan canvas hasil pangkas, atau null bila tidak ada yang perlu dipangkas. */
function trimCanvas(img) {
  const nw = img.naturalWidth || img.width, nh = img.naturalHeight || img.height;
  const k = Math.min(1, 1600 / nw), w = Math.max(1, Math.round(nw * k)), h = Math.max(1, Math.round(nh * k));
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d', { willReadFrequently: true }); g.drawImage(img, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const cs = [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)];
  const clear = cs.every(i => d[i + 3] < 20);
  const bg = [0, 1, 2].map(j => cs.reduce((a, i) => a + d[i + j], 0) / 4);
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = at(x, y); if (d[i + 3] < 20) { continue; }
      if (!clear && Math.abs(d[i] - bg[0]) + Math.abs(d[i + 1] - bg[1]) + Math.abs(d[i + 2] - bg[2]) < 60) { continue; }
      if (x < x0) { x0 = x; } if (x > x1) { x1 = x; } if (y < y0) { y0 = y; } if (y > y1) { y1 = y; }
    }
  }
  if (x1 < 0) { return null; }
  const m = Math.max(2, Math.round(Math.max(w, h) * .015));
  x0 = Math.max(0, x0 - m); y0 = Math.max(0, y0 - m); x1 = Math.min(w - 1, x1 + m); y1 = Math.min(h - 1, y1 + m);
  const cw = x1 - x0 + 1, ch = y1 - y0 + 1;
  if (cw * ch >= w * h * .92) { return null; }
  const out = document.createElement('canvas'); out.width = Math.round(cw / k); out.height = Math.round(ch / k);
  const og = out.getContext('2d'); og.drawImage(img, x0 / k, y0 / k, cw / k, ch / k, 0, 0, out.width, out.height);
  if (!clear && (bg[0] + bg[1] + bg[2]) / 3 >= 200) {   // latar terang polos (mis. JPG berlatar abu-abu muda): jadikan transparan agar menyatu dengan kertas
    const im = og.getImageData(0, 0, out.width, out.height), q = im.data;
    for (let i = 0; i < q.length; i += 4) {
      const dist = Math.abs(q[i] - bg[0]) + Math.abs(q[i + 1] - bg[1]) + Math.abs(q[i + 2] - bg[2]);
      if (dist < 45) { q[i + 3] = 0; } else if (dist < 120) { q[i + 3] = Math.round(255 * (dist - 45) / 75); }
    }
    og.putImageData(im, 0, 0); out._alpha = true;
  }
  return out;
}
/** Logo yang ruang kosong di tepinya sudah dipangkas (di-cache). Dipakai di menu, login, struk, invoice, laporan. */
const TRIM = {};
async function trimmedSrc(src) {
  if (!src) { return ''; }
  if (TRIM[src]) { return TRIM[src]; }
  let out = src;
  try { const c = trimCanvas(await loadImg(src)); if (c) { out = c.toDataURL(c._alpha || !/^data:image\/jpeg/.test(src) ? 'image/png' : 'image/jpeg', .92); } } catch (e) { /* pakai logo asli */ }
  TRIM[src] = out; return out;
}

function invoiceHtml(t) {

  if (pct > 0) {   // diskon persen dibagi ke tiap baris; selisih pembulatan masuk baris terakhir agar jumlahnya pas
    let sum = 0; lines.forEach(l => { l.total = Math.round(l.total * (1 - pct / 100)); sum += l.total; });
    lines[lines.length - 1].total += (t.subtotal - t.discount_amount) - sum;

/* ---------- tema ---------- */
function applyTheme() { const t = store.get('ksr_theme'); if (t === 'light' || t === 'dark') { document.documentElement.setAttribute('data-theme', t); } else { document.documentElement.removeAttribute('data-theme'); } }
function cycleTheme() {
  const cur = store.get('ksr_theme') || 'auto', next = { auto: 'light', light: 'dark', dark: 'auto' }[cur];
  if (next === 'auto') { store.del('ksr_theme'); } else { store.set('ksr_theme', next); }
  applyTheme(); toast('Tema: ' + { auto: 'ikuti perangkat', light: 'terang', dark: 'gelap' }[next]);
}

async function enter() {
  let b;
  try { b = await api('bootstrap'); saveCache(b); }
  catch (e) {
    const c = e.code === 'OFFLINE' ? loadCache() : null;
    if (!c) { throw e; }
    b = JSON.parse(JSON.stringify(c.b));
  }
  S.user = b.user; S.settings = b.settings; applyColors(S.settings.theme, true); await warmLogo(); S.products = applyQueueStock(b.products); S.categories = b.categories; S.customers = b.customers;
  S.cart = []; S.customerId = 0; S.discValue = 0; S.cat = 'all'; S.q = ''; S.qrisImg = null;
  Object.keys(S.sel).forEach(k => S.sel[k].clear());
  renderShell(); go(location.hash === '#kasir' || S.user.role !== 'admin' || !NET.online ? 'kasir' : 'dashboard');
  if (NET.online) { setTimeout(() => syncQueue(false), 400); }
}

function renderNav() {
  const items = NAV.filter(n => n.roles.includes(S.user.role)); let g = '', h = '';
  items.forEach(n => {
    if (n.g !== g) { g = n.g; h += '<div class="grp">' + g + '</div>'; }
    h += '<button type="button" data-act="nav" data-v="' + n.id + '"' + (S.view === n.id ? ' aria-current="page"' : '') + '>' + icon(n.id) + '<span>' + n.label + '</span></button>';
  });
  $('#nav').innerHTML = h;
  // navigasi bawah (HP): maksimal 4 menu utama + tombol "Menu" untuk sisanya
  const main = items.filter(n => ['kasir', 'riwayat', 'dashboard', 'produk'].includes(n.id)).slice(0, 4);
  const more = items.some(n => !main.includes(n)) || true;
  const bn = $('#bnav');
  if (bn) {
    const short = { dashboard: 'Laporan' };
    bn.innerHTML = main.map(n => '<button type="button" data-act="nav" data-v="' + n.id + '"' + (S.view === n.id ? ' aria-current="page"' : '') + '>' + icon(n.id) + '<span>' + (short[n.id] || n.label) + '</span></button>').join('') +

const mqOverlay = window.matchMedia('(max-width:1023px)');
function applyNav() {
  const sh = $('#shell'); if (!sh) { return; }
  let st;
  if (mqOverlay.matches) { st = S.navOverlay ? 'open' : 'closed'; }
  else { st = store.get('ksr_nav') || (window.innerWidth >= 1280 ? 'open' : 'closed'); }
  sh.dataset.nav = st;
  const b = $('.burger'); if (b) { b.setAttribute('aria-expanded', String(st === 'open')); }
}
if (mqOverlay.addEventListener) { mqOverlay.addEventListener('change', () => { S.navOverlay = false; applyNav(); }); }
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !modals.length && S.navOverlay) { S.navOverlay = false; applyNav(); } });
function go(v) {
  if (S.themeDraft) { S.themeDraft = null; applyColors(ST().theme); }
  const n = NAV.find(x => x.id === v);
  if (!n || !n.roles.includes(S.user.role)) { v = 'kasir'; }
  S.view = v; renderNav(); document.body.classList.toggle('is-kasir', v === 'kasir'); if (v !== 'kasir') { document.body.classList.remove('cart-on'); } S.navOverlay = false; applyNav();

  try { VIEWS[v](); } catch (e) { viewError(e, () => go(v)); }
}

function changePassword() {
  const m = openModal({
    title: 'Ganti password', focus: '#pc',
    body: '<label class="field"><span>Password saat ini</span><input id="pc" type="password" autocomplete="current-password"></label>' +
      '<label class="field"><span>Password baru (min. 6 karakter)</span><input id="pn" type="password" autocomplete="new-password"></label>' +
      '<label class="field"><span>Ulangi password baru</span><input id="pn2" type="password" autocomplete="new-password"></label><div class="form-error" id="pe" hidden></div>',
    foot: '<button type="button" class="btn" data-close2>Batal</button><button type="button" class="btn btn-primary" id="ps">Simpan</button>'
  });
  m.$('[data-close2]').onclick = () => m.close();
  const save = () => {
    const err = m.$('#pe'); err.hidden = true;
    if (m.$('#pn').value !== m.$('#pn2').value) { err.textContent = 'Ulangi password baru tidak sama.'; err.hidden = false; return; }
    run(m.$('#ps'), async () => {
      try {
        const r = await api('passwordChange', { current: m.$('#pc').value, password: m.$('#pn').value });
        S.token = r.token; store.set('ksr_tok', r.token); S.defaultPw = false; renderBanner(); m.close(); toast('Password berhasil diganti.', 'ok');
      } catch (e) { if (e.code !== 'AUTH') { err.textContent = e.message; err.hidden = false; } }
    });
  };
  m.$('#ps').onclick = save;
  m.el.addEventListener('keydown', e => { if (e.key === 'Enter') { save(); } });
}

async function boot() {
  applyTheme();
  if (IS_LOCAL) {
    document.body.classList.add('local');
  } else if (IS_DEMO) {
    $('#demoNote').hidden = false;
    const b = $('#demoNet');

      window.KASIRKU_DEMO.offline = !window.KASIRKU_DEMO.offline; b.setAttribute('aria-pressed', String(window.KASIRKU_DEMO.offline));
      b.textContent = window.KASIRKU_DEMO.offline ? 'Server terputus — klik untuk sambungkan' : 'Simulasi: putuskan server';
      if (S.user) { api('ping').catch(() => {}); }
    };
  } else if ('serviceWorker' in navigator && (location.protocol === 'https:' || /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))) {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  const tok = store.get('ksr_tok');
  if (tok) {
    S.token = tok;
    try { await enter(); return; }
    catch (e) { S.token = null; if (e.code === 'OFFLINE') { showLogin('Server tidak terjangkau. Nyalakan Apache & MySQL di XAMPP (atau periksa internet), lalu masuk kembali.'); return; } }
  }
  showLogin();
}

    catch (e) { const c = store.get('ksr_qris'); if (e.code === 'OFFLINE' && c) { S.qrisImg = c; } else { throw e; } }

function calcCart() {
  const sub = S.cart.reduce((a, l) => a + l.price * l.qty, 0);
  const v = Number(S.discValue) || 0;
  let disc = S.discType === 'percent' ? Math.round(sub * Math.min(v, 100) / 100) : Math.round(v);
  disc = Math.min(disc, sub);
  const tax = Math.round((sub - disc) * (ST().tax_rate || 0) / 100);
  return { sub, disc, tax, grand: sub - disc + tax };
}
