plugins {
    id 'com.android.application'
}

// versionCode naik otomatis di GitHub Actions supaya APK baru bisa dipasang menimpa yang lama
def runNo = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as Integer

android {
    namespace 'com.hdt.kasir'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        versionCode runNo
        versionName "1.0.${runNo}"
    }

    // Kunci tanda tangan TETAP (bukan debug acak di tiap build) supaya update APK
    // bisa dipasang di atas versi lama tanpa menghapus data kasir di HP.
    signingConfigs {
        demo {
            storeFile file('../keystore/demo.keystore')
            storePassword 'kasirdemo'
            keyAlias 'kasir'
            keyPassword 'kasirdemo'
        }
    }

    flavorDimensions = ['app']
    productFlavors {
        kasirku {
            dimension 'app'
            applicationId 'com.hdt.kasirku'
            buildConfigField 'String', 'BRIDGE', '"KasirkuAndroid"'
            buildConfigField 'String', 'APP_NAME', '"Kasirku"'
        }
        cuciaja {
            dimension 'app'
            applicationId 'com.hdt.cuciaja'
            buildConfigField 'String', 'BRIDGE', '"CuciAjaAndroid"'
            buildConfigField 'String', 'APP_NAME', '"CuciAja"'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.demo
        }
        debug {
            signingConfig signingConfigs.demo
        }
    }

    buildFeatures { buildConfig true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
