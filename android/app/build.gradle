plugins {
    id 'com.android.application'
}

android {
    namespace 'id.asker.pinapos'
    compileSdk 34

    defaultConfig {
        applicationId 'id.asker.pinapos'
        minSdk 24
        targetSdk 34
        // Nomor versi otomatis dari GitHub Actions: <APP_VERSION_BASE>.<nomor build>, mis. 1.3.12.
        // Setiap build menjadi rilis baru, sehingga jumlah unduhan versi lama tidak hilang.
        versionCode Math.max((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger(), 1)
        versionName "${System.getenv('APP_VERSION_BASE') ?: '1.3'}.${System.getenv('GITHUB_RUN_NUMBER') ?: '0'}"
    }

    buildFeatures {
        buildConfig true
    }

    // Satu pembungkus Android untuk dua aplikasi: PinaPos (kasir toko) dan CuciAja (kasir laundry)
    flavorDimensions 'app'
    productFlavors {
        pinapos {
            dimension 'app'
            applicationId 'id.asker.pinapos'
            resValue 'string', 'app_name', 'PinaPos'
            buildConfigField 'String', 'APP_DIR', '"kasirku"'
            buildConfigField 'String', 'APP_NAME', '"PinaPos"'
            buildConfigField 'String', 'BRIDGE', '"KasirkuAndroid"'
        }
        cuciaja {
            dimension 'app'
            applicationId 'id.asker.cuciaja'
            resValue 'string', 'app_name', 'CuciAja'
            buildConfigField 'String', 'APP_DIR', '"cuciaja"'
            buildConfigField 'String', 'APP_NAME', '"CuciAja"'
            buildConfigField 'String', 'BRIDGE', '"CuciAjaAndroid"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
