plugins {
    id 'com.android.application'
}

android {
    namespace 'id.asker.pinapos'
    compileSdk 34

    defaultConfig {
        applicationId 'id.asker.pinapos'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildFeatures {
        buildConfig true
    }

    // Satu pembungkus Android untuk dua aplikasi: PinaPos (kasir toko) dan CuciAja (kasir laundry)
    flavorDimensions 'app'
    productFlavors {
        pinapos {
            dimension 'app'
            applicationId 'id.asker.pinapos'
            resValue 'string', 'app_name', 'PinaPos'
            buildConfigField 'String', 'APP_DIR', '"kasirku"'
            buildConfigField 'String', 'APP_NAME', '"PinaPos"'
        }
        cuciaja {
            dimension 'app'
            applicationId 'id.asker.cuciaja'
            resValue 'string', 'app_name', 'CuciAja'
            buildConfigField 'String', 'APP_DIR', '"cuciaja"'
            buildConfigField 'String', 'APP_NAME', '"CuciAja"'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
