plugins {
    id 'com.android.application'
}

android {
    namespace 'id.asker.pinapos'
    compileSdk 34

    defaultConfig {
        applicationId 'id.asker.pinapos'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
