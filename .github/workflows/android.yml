name: Build APK Android

# Membuat APK Kasirku & CuciAja (offline, tanpa server) setiap kali kode aplikasi berubah.
# Hasilnya dipublikasikan di halaman Releases:
#   https://github.com/<pemilik>/<repo>/releases/latest
on:
  push:
    paths:
      - 'kasirku/**'
      - 'cuciaja/**'
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Siapkan tampilan aplikasi (mode offline)
        run: python3 android/prepare_assets.py

      - name: Build APK
        run: gradle -p android assembleKasirkuRelease assembleCuciajaRelease --no-daemon --stacktrace

      - name: Kumpulkan APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/kasirku/release/*.apk out/Kasirku.apk
          cp android/app/build/outputs/apk/cuciaja/release/*.apk out/CuciAja.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: apk-android
          path: out/*.apk

      - name: Terbitkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Aplikasi Android v1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: 'true'
          body: |
            APK offline (tanpa server) — data tersimpan di HP.

            - **Kasirku.apk** — kasir toko
            - **CuciAja.apk** — kasir laundry

            Login pertama: `admin` / `admin123` (segera ganti password).
            Pasang di atas versi lama untuk update — data tidak hilang.
          files: out/*.apk
